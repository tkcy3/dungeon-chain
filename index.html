.box{background:#211a25;border:1px solid #4d3f57;border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box h2{font-size:18px;margin-bottom:6px;text-align:center}

.box .opt{display:block;width:100%;text-align:left;background:#2e2535;border:1px solid #5d4a69;color:#eee;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.box .opt small{display:block;color:#c4b4cc;font-size:13px;margin-top:2px}
.box .opt:active{background:#40324a}
.box textarea{width:100%;height:110px;background:#151017;color:#ddd;border:1px solid #4d3f57;border-radius:8px;font-size:12px;padding:6px;margin-top:8px;user-select:text;-webkit-user-select:text}

#title h1{font-size:28px;letter-spacing:.1em;white-space:nowrap;margin:2px 0 6px;font-family:var(--mincho);font-weight:600;color:#e6dccb;text-shadow:0 0 18px rgba(255,170,90,.25)}

#title .tin{position:relative;z-index:2;width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(9vh,72px);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.tbg{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);width:min(96vw,420px);aspect-ratio:6/8;z-index:0;-webkit-mask-image:linear-gradient(transparent 0,#000 14%,#000 38%,transparent 64%);mask-image:linear-gradient(transparent 0,#000 14%,#000 38%,transparent 64%)}
.tboard{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);gap:5px;padding:5px;filter:brightness(.5) saturate(.65)}
.tboard i{font-style:normal;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:min(7.6vw,34px);transition:filter .3s,transform .3s,opacity .35s;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.tboard i.on{filter:brightness(2) saturate(1.3);transform:scale(1.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 0 12px rgba(255,255,255,.25)}
.tboard i.gone{opacity:0;transform:scale(.6)}
.ttrace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}
.tshade{position:absolute;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(ellipse at 50% 35%,transparent 40%,rgba(0,0,0,.6) 100%)}
.tlogo{position:relative;text-align:center;padding:18px 0;animation:tIn 1.4s ease-out both}
.tl1,.tl2{font-family:"Cinzel","Trajan Pro","Times New Roman",serif;font-weight:900;line-height:.95;letter-spacing:.12em;padding-left:.12em;
  background:linear-gradient(180deg,#fbeec8 0%,#e8b33a 55%,#a97a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 16px rgba(0,0,0,.9))}
.tl1{font-size:min(13.5vw,58px)}.tl2{font-size:min(17vw,74px);letter-spacing:.2em;padding-left:.2em}
.torn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 8px;width:78%}
.torn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a060,transparent)}.torn b{color:#d9b06a;font-size:10px}
.tsubt{font-family:var(--mincho);font-size:14px;letter-spacing:.42em;padding-left:.42em;color:#d8c8b0;text-shadow:0 1px 6px #000}
.tlogo::before{content:'';position:absolute;left:-12%;right:-12%;top:-10%;bottom:-10%;z-index:-1;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,9,11,.88),rgba(10,9,11,.45) 60%,transparent 75%)}
@keyframes tIn{from{opacity:0;transform:translateY(-10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.tlow{width:100%;display:flex;flex-direction:column;align-items:center}
#bestLine{font-size:14px;color:#cbbfa8;min-height:18px;margin:0 0 12px;letter-spacing:.04em}
.tmain{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
.tbtn{width:100%;padding:12px;border-radius:12px;border:1px solid #5d4a69;background:#2e2535;color:#eee;font-size:16px;letter-spacing:.08em}
.tbtn small{display:block;font-family:inherit;font-size:11.5px;color:#bba9c4;letter-spacing:.02em;margin-top:3px}
.tbtn.pri{padding:15px;font-size:19px;border:1.5px solid #e8b33a;background:#2e2535;color:#fff;box-shadow:0 0 18px rgba(232,179,58,.18)}
.tbtn:active{filter:brightness(1.2)}
.tsub{display:flex;gap:8px;justify-content:center;margin-top:18px;width:100%;max-width:320px}
.tsub button{flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:10px;border:1px solid #3a2f3e;background:#241c27;color:#bba9c4;font-size:11px}
.tsub button span{font-size:20px;filter:saturate(.75)}
#cloud{font-size:12.5px;color:#8f8396;margin-top:14px}
#ver{font-size:12.5px;color:#7f7682;margin-top:6px;background:none;border:0;padding:4px 8px;font-family:inherit}#ver.new{color:#e8b33a}
.chg h3{font-size:14px;margin:12px 0 4px;color:#f0d9a8}.chg h3 small{color:#8f8396;font-weight:400;margin-left:6px}.chg ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.65;color:#d9d0dc}
.big{font-size:44px}
#tip{position:fixed;z-index:20;max-width:290px;background:#2b2131;border:1px solid #7a6488;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;color:#eee;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#tip .th{font-weight:700;font-size:16px;margin-bottom:4px}#tip small{color:#b9a9bd;font-size:13px}
.bar,#stats,.sk,#itFloor{touch-action:none;-webkit-touch-callout:none}
.sk.off{opacity:.45}
</style>

<body>
<div id="app">
  <div id="top">
    <div class="st"><span class="it" id="itFloor"><i>階層</i><b id="tTurn" class="fl">B1F</b></span><span class="it"><i>撃破</i><b id="tKill">0</b></span><span class="it"><i>Lv</i><b id="tLv">1</b></span></div>
    <button class="ibtn" id="bgmBtn">🎵</button><button class="ibtn" id="sfxBtn">🔊</button><button class="ibtn" id="vibBtn">🫨</button><button class="ibtn" id="menuBtn">☰</button>
  </div>
  <div id="bars">
    <div class="bar hp" id="bHp"><div class="fill"></div><span></span></div>
    <div class="bar ar" id="bAr"><div class="fill"></div><span></span></div>
    <div class="bar xp" id="bXp"><div class="fill"></div><span></span></div>
    <div class="bar gd" id="bGd"><div class="fill"></div><span></span></div>
    <div class="bar sh" id="bSh"><div class="fill"></div><span></span></div>
  </div>
  <div id="stats" onclick="if(event.target.closest('#relicBtn'))showRelics()"></div>
  <div id="preview"></div>
  <div id="wrap"><canvas id="board"></canvas><button id="tutSkip" class="hidden">チュートリアルを飛ばす ›</button></div>
  <div id="log"></div>
  <div id="skills"></div>
</div>

<div id="story" class="hidden"><div class="lantern"></div><div id="storyText"></div><div id="storyHint">― タップで進む ―</div><button id="storySkip">スキップ ›</button></div>
<div id="achToast"></div>
<div id="tip" class="hidden"></div>
<div class="ov hidden" id="modal"><div class="box" id="mbox"></div></div>

<div class="ov" id="title">
  <div class="tbg"><div class="tboard" id="tBoard"></div><svg id="tTrace" class="ttrace"></svg></div>
  <div class="tshade"></div>
  <div class="tin">
    <div class="tlogo">
      <div class="tl1">DUNGEON</div><div class="tl2">CHAIN</div>
    </div>
    <div class="tlow">
    <div id="bestLine"></div>
    <div class="tmain">
      <button class="tbtn pri" id="btnCont">続きから</button>
      <button class="tbtn" id="btnNew">冒険に出る</button>
    </div>
    <div class="tsub">
      <button id="btnAch"><span>🏆</span>実績</button>
      <button id="btnSet"><span>⚙️</span>設定</button>
      <button id="btnImport"><span>📥</span>読み込み</button>
    </div>
    <div id="cloud">セーブ: 確認中…</div>
    <button id="ver"></button>
    </div>
  </div>
</div>

<script>
'use strict';
const N=6;
const ICON={skull:'💀',sword:'⚔️',shield:'🛡️',potion:'🧪',coin:'💰'};
const BG={skull:'#3d1a1f',sword:'#2e3443',shield:'#1a3148',potion:'#3a1f41',coin:'#4a3b14'};
const LS_SAVE='dchain_save_v1',LS_BEST='dchain_best_v1';
const SKILLS={
  fire:{name:'火球',icon:'🔥',cd:14,desc:'全ての敵にダメージ',scale:1},
  heal:{name:'治癒',icon:'💚',cd:18,desc:'HPを最大値の40%回復'},
  wall:{name:'鉄壁',icon:'🧱',cd:14,desc:'防御を最大まで回復'},
  alchemy:{name:'錬金',icon:'⚗️',cd:12,desc:'盤面の🛡️を全て💰に変える'},
  arm:{name:'武装',icon:'🗡️',cd:12,desc:'盤面の🧪を全て⚔️に変える'},
  quake:{name:'地殻変動',icon:'🌀',cd:10,desc:'敵以外のタイルを全て入れ替える'},
  execute:{name:'処刑',icon:'☠️',cd:14,desc:'弱った敵を全て倒す（装甲無視・ボス以外）。経験値1.5倍',scale:1},
  thunder:{name:'雷撃',icon:'⚡',cd:12,desc:'ランダムな敵3体にダメージ',scale:1},
  magnet:{name:'磁力',icon:'🧲',cd:14,desc:'盤面の💰を全て回収する'},
  freeze:{name:'凍結',icon:'❄️',cd:16,desc:'全ての敵を2ターン 動けなくする'},
  snipe:{name:'狙撃',icon:'🎯',cd:12,desc:'いちばん硬い敵にダメージ',scale:1},
  crush:{name:'粉砕',icon:'🔨',cd:10,desc:'全ての敵の装甲を0にする'},
  bless:{name:'祝福',icon:'🌟',cd:20,desc:'3ターンの間、チェーンが3つ長い扱いになる（効果の倍率アップ）'}
};

const atkP=()=>S?S.baseDmg+3*S.weaponDmg:7;
const SKD={fire:()=>Math.round(.6*atkP()+(S?S.turn:0)/9),thunder:()=>Math.round(atkP()+(S?S.turn:0)/5),snipe:()=>Math.round(2*atkP()+(S?S.turn:0)/3)};
const execLine=e=>Math.max(SKD.fire(),Math.ceil(e.maxHp*.5));
function skillDesc(k){
  if(k==='fire')return `全ての敵に${SKD.fire()}ダメージ`;
  if(k==='thunder')return `ランダムな敵3体に${SKD.thunder()}ダメージ`;
  if(k==='snipe')return `いちばん硬い敵に${SKD.snipe()}ダメージ`;
  if(k==='execute')return `残りHP${SKD.fire()}以下か半分以下の敵を全て倒す（装甲無視・ボス以外）。経験値1.5倍`;
  return SKILLS[k].desc;
}
const cdOf=k=>Math.max(4,Math.round(SKILLS[k].cd*((S&&S.cdMul)||1)));
let S=null,chain=[],dragging=false,modalOpen=false,inGame=false;
let savedJson=null,best=null,SLOT=0;
const NSLOT=3,LS_SLOT='dchain_slot_v1',slotKey=i=>i?LS_SAVE+'_'+(i+1):LS_SAVE;
function slotJson(i){try{return localStorage.getItem(slotKey(i));}catch(e){return null;}}
function setSlot(i){SLOT=i;savedJson=slotJson(i);try{localStorage.setItem(LS_SLOT,String(i));}catch(e){}}
function slotInfo(i){const j=slotJson(i);if(!j)return null;try{const s=JSON.parse(j);return s;}catch(e){return {broken:1};}}
const anySave=()=>[0,1,2].some(i=>slotJson(i));
let DB=null,UID=null,cloudOn=false;

const $=id=>document.getElementById(id);
const cv=$('board'),ctx=cv.getContext('2d');
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const groupOf=t=>(t==='sword'||t==='skull')?'atk':(typeof S!=='undefined'&&S&&S.cls==='alchemist'&&!TUT&&(t==='coin'||t==='shield'||t==='potion'))?'mix':t;
const isEnemy=t=>t&&t.t==='skull';

/* ---------- state ---------- */
function newState(cls){
  const s={v:1,ts:Date.now(),turn:0,kills:0,level:1,xp:0,xpNeed:16,
    hp:50,maxHp:50,armor:0,maxArmor:4,armorPer:1,
    baseDmg:1,weaponDmg:2,healPer:2,goldPer:2,
    gold:0,goldNeed:70,shieldPts:0,shieldNeed:30,
    skills:[],pending:[],bossFlag:false,maxChain:0,bless:0,floor:1,fprog:0,bossUp:false,run:{hit:false,shops:0,mute:0},board:[]};
  if(!TUT){s.curse=0;s.relics=[];}
  for(let r=0;r<N;r++){s.board.push([]);for(let c=0;c<N;c++){const t=randTile(s);t.ry=r;s.board[r].push(t);}}
  applyClass(s,TUT?'warrior':(cls||(S&&S.cls)||'warrior'));
  if(!TUT)s.name=getName();S=s;ensureMove();if(!TUT){achStat('games');const td=new Date().toDateString();if(ACH.st.lastDay!==td){ACH.st.lastDay=td;achStat('days');}achSave();}
  return s;
}
function randTile(s,noEnemy){
  const aw=t=>{const a=s.anom&&ANOMS[s.anom];return a&&a.w&&a.w[t]||1;};
  const w=[['skull',noEnemy?0:(17+Math.min(8,s.turn/40))*aw('skull')*(!TUT&&playsN()>=3?.92:1)*(s.relics&&s.relics.includes('bell')?.82:1)*(s.bossKind==='vampire'&&s.board&&s.board.length&&s.board.flat().some(e=>e&&e.boss)?.6:1)],['sword',20*aw('sword')],['shield',19*aw('shield')],['potion',17*aw('potion')],['coin',20*aw('coin')]];
  let x=Math.random()*w.reduce((a,b)=>a+b[1],0);
  for(const [t,v] of w){if((x-=v)<0)return t==='skull'?makeEnemy(s):{t};}
  return {t:'coin'};
}
/* ---------- relics (run-only passives) ---------- */
const RELICS={
  trident:{ic:'🔱',n:'三叉の槍',d:'剣を3本以上含む攻撃が1.3倍'},
  chalice:{ic:'🏆',n:'黄金の杯',d:'5つ以上のチェーンで💰+4'},
  ring:{ic:'💍',n:'血の指輪',d:'敵を倒すたびにHP+1'},
  amulet:{ic:'🧿',n:'魔除けの眼',d:'受けるダメージが毎ターン1減る'},
  hourglass:{ic:'⏳',n:'砂時計',d:'スキルの再使用ターンが15%短い'},
  clover:{ic:'🍀',n:'四つ葉',d:'5つ以上のチェーンで経験値+1'},
  heart:{ic:'❤️‍🔥',n:'炎の心臓',d:'ボス・中ボスへのダメージ1.5倍'},
  frost:{ic:'🧊',n:'霜の欠片',d:'7つ以上のチェーンのあと、残った敵が1ターン凍る'},
  crest:{ic:'🎖️',n:'騎士の紋章',d:'🛡️チェーンの防御が1.5倍'},
  urn:{ic:'⚱️',n:'錬金の壺',d:'🧪の余りが変わる量が2倍'},
  greed:{ic:'💎',n:'欲深の宝石',d:'💰の価値+1。ただし受けるダメージ+1',on:()=>{S.goldPer++;}},
  blade:{ic:'🗡️',n:'処刑人の刃',d:'HPが半分以下の敵へのダメージ1.5倍'},
  dice:{ic:'🎲',n:'運命のサイコロ',d:'攻撃が15%の確率で2倍'},
  clock:{ic:'🕰️',n:'古時計',d:'新しく出る💣の爆発までが2ターン長い'},
  meat:{ic:'🍖',n:'骨付き肉',d:'最大HP+20',on:()=>{S.maxHp+=20;S.hp+=20;}},
  ledger:{ic:'🧾',n:'値切りの帳面',d:'ショップの必要額が少し安くなる',on:()=>{S.goldNeed=Math.round(S.goldNeed*.85);}},
  feather:{ic:'🪶',n:'不死鳥の羽',d:'一度だけ、倒れてもHP半分で蘇る'},
  lantern:{ic:'🏮',n:'導きのランタン',d:'4つ以上のチェーンの倍率+0.1'},
  /* added at stage s4 */
  gauntlet:{ic:'🥊',n:'巨人の籠手',d:'基礎攻撃力+8',x:1,on:()=>{S.baseDmg+=8;}},
  starfrag:{ic:'✨',n:'星のかけら',d:'長いチェーンの経験値ボーナスが2倍',x:1},
  mirror:{ic:'🪞',n:'反射の鏡',d:'受けたダメージの半分を、敵1体に返す',x:1},
  tome:{ic:'📖',n:'禁書',d:'スキルを使うたびに経験値+3',x:1},
  bell:{ic:'🔔',n:'静寂の鈴',d:'新しく出る敵が少し減る',x:1},
  purse:{ic:'👛',n:'底なしの財布',d:'敵を倒すたびに💰+1',x:1}
};
const hasR=id=>!!(typeof S!=='undefined'&&S&&S.relics&&S.relics.includes(id));
function relicTgt(e,d){if(!S||!S.relics)return d;let m=1;if(hasR('heart')&&(e.boss||e.mini))m*=1.5;if(hasR('blade')&&e.hp<=e.maxHp/2)m*=1.5;return m===1?d:Math.round(d*m);}
function relicOptions(){const pool=Object.keys(RELICS).filter(k=>!hasR(k)&&!RELICS[k].x);
  return pick(pool.map(k=>({label:`${RELICS[k].ic} ${RELICS[k].n}`,desc:RELICS[k].d,apply:()=>{S.relics=S.relics||[];S.relics.push(k);UNL.relSeen=UNL.relSeen||{};UNL.relSeen[k]=1;unlSave();if(RELICS[k].on)RELICS[k].on();}})),3);}
function showRelics(){if(modalOpen||!S.relics||!S.relics.length)return;openModal(`<h2>🏺 持っている遺物</h2><div class="alist">${S.relics.map(k=>`<div class="ach"><span class="ai">${RELICS[k].ic}</span><span><b>${RELICS[k].n}</b><small>${RELICS[k].d}</small></span></div>`).join('')}</div><p style="text-align:center;font-size:12px;color:#a99fae">遺物はこの冒険のあいだだけ有効</p><button class="opt" id="rlX" style="text-align:center">閉じる</button>`);$('rlX').onclick=closeModal;}
function relicsHtml(){return (S.relics||[]).map(k=>RELICS[k].ic).join('');}

/* ---------- floor anomalies ---------- */
const ANOMS={
  fog:{ic:'🌫️',n:'濃霧',d:'敵のHPと攻撃力が見えない'},
  drought:{ic:'🏜️',n:'薬枯れ',d:'🧪が出にくい',w:{potion:.35}},
  goldrain:{ic:'🌧️',n:'黄金の雨',d:'💰が出やすい',w:{coin:1.8}},
  iron:{ic:'⚙️',n:'鉄の時代',d:'⚔️が出やすく、🛡️が出にくい',w:{sword:1.6,shield:.5}},
  feast:{ic:'🎪',n:'魔物の宴',d:'敵が多い。倒すと経験値+1',w:{skull:1.45}},
  calm:{ic:'🌙',n:'静寂の夜',d:'敵が少ない',w:{skull:.65}},
  blood:{ic:'🩸',n:'血の月',d:'新しく出る敵のHP+25%。倒すと💰+2'},
  wind:{ic:'🍃',n:'追い風',d:'4つ以上のチェーンの倍率+0.15'},
  rust:{ic:'🟤',n:'腐食',d:'防御が毎ターン1ずつ錆びていく'}
};
function rollAnomaly(F,msgs){return;
  if(F%10===1&&F>10){if(Math.random()<.55){const ks=Object.keys(ANOMS).filter(k=>k!==S.anom);S.anom=ks[rnd(ks.length)];S.anomTo=F+9;const a=ANOMS[S.anom];msgs.push(`${a.ic} 異変「${a.n}」：${a.d}`);}else if(S.anom){msgs.push(`${ANOMS[S.anom].ic} 異変がおさまった`);S.anom=null;}}
  else if(S.anom&&F>S.anomTo){msgs.push(`${ANOMS[S.anom].ic} 異変がおさまった`);S.anom=null;}}

/* ---------- death effects (queued, resolved after the board refills) ---------- */
function flushDeath(msgs,depth=0){if(!S||!S._dq||!S._dq.length)return;const q=S._dq;S._dq=[];let db=0,fz=false;
  for(const k of q){const D=EK[k]||{};

  if(RARE_GATE[k]){const [f,c]=RARE_GATE[k];return `★レア・B${f}F以降${c?`・元凶を${c}回倒すと`:''}`;}
  for(const [f,o] of BANDS)if(o[k]!==undefined){const c=Array.isArray(o[k])?o[k][1]:0;return `B${f}F以降${c?`・元凶を${c}回倒すと`:''}${PLAY_GATE[k]?`・冒険${PLAY_GATE[k]}回目から`:''}`;}
  return '何かから生まれるらしい';}
function makeMini(s){const F=s.floor||1,k=MINI_ORDER[Math.floor(F/20)%MINI_ORDER.length],e=makeKind(k,s.turn);
  e.mini=true;e.hp=e.maxHp=Math.round(e.hp*3.6+8);e.atk+=2;e.armor+=2;s.bossAnnounce=EK[k].icon+' 中ボス「'+EK[k].name+'」';return e;}
function makeBoss(s){
  const T=s.turn,F=s.floor||1,n=Math.max(1,Math.round(F/20)),k=bossKindAt(n*20),m=1+Math.floor((n-1)/5)*.6;
  if(k==='abyss'){const e={t:'skull',kind:k,boss:true,fresh:true,hp:Math.round((60+T+T*T/300)*m),atk:Math.round((5+T/25)*m),armor:Math.round(4*m),ch:0,sm:0};
    if(s.curse){e.hp=Math.round(e.hp*(1+.12*s.curse));e.atk+=Math.floor(s.curse/3);}
    e.maxHp=e.hp;noteMet(k);s.bossUp=true;s.bossKind=k;s.bossTurn=s.turn;s.bossAnnounce=EK[k].icon+' '+EK[k].name+(m>1?'（さらに強大）':'');return e;}
  const e={t:'skull',kind:k,boss:true,fresh:true,hp:Math.round((22+T/2.5+T*T/2500)*m),atk:Math.round((3+T/35)*m),armor:Math.round((2+T/50)*m)};
  if(k==='dragon'){e.hp=Math.round(e.hp*1.1);e.armor=2;e.ch=0;}
  if(k==='vampire'){e.hp=Math.round(e.hp*.85);e.armor=Math.round(e.armor/2);e.sm=0;}
  if(k==='kraken'){e.hp=Math.round(e.hp*1.2);e.armor=1;}
  if(n===1){e.hp=Math.round(e.hp*.85);e.atk=Math.max(3,e.atk-1);}
  if(s.curse){e.hp=Math.round(e.hp*(1+.12*s.curse));e.atk+=Math.floor(s.curse/3);}
  e.maxHp=e.hp;noteMet(k);s.bossUp=true;s.bossKind=k;s.bossTurn=s.turn;s.bossAnnounce=EK[k].icon+' '+EK[k].name+(m>1?'（強化）':'');return e;
}
function enemyAtk(e){
  if(e.fresh||e.frz>0)return {d:0,p:0};
  const k=bhOf(e),D=EK[kindOf(e)]||{};
  if(D.z)return {d:0,p:0};
  if(D.pc)return {d:0,p:e.atk+(D.ag?0:auraN())};
  if(k==='golem'&&e.rest)return {d:0,p:0};
  if(k==='bomb')return (e.cnt||0)<=1?{d:e.boom||0,p:0}:{d:0,p:0};
  if(k==='dragon')return {d:(e.ch||0)+1>=3?e.atk*3:e.atk,p:0};
  if(k==='abyss')return {d:(e.ch||0)+1>=3?Math.round(e.atk*2.5):e.atk,p:0};
  const ag=D.ag?0:auraN();
  if(k==='spider')return {d:0,p:e.atk+ag};
  return {d:e.atk+ag,p:0};
}
function guarded(e){const p=findTile(e);if(!p)return false;for(const q of neighbors(p[0],p[1])){const t=tileAt(q);if(t!==e&&isEnemy(t)&&(EK[kindOf(t)]||{}).gd)return true;}return false;}
function auraN(){let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=S.board[r][c];if(isEnemy(t)&&(EK[kindOf(t)]||{}).ag)n++;}return n;}
function findTile(e){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c]===e)return [r,c];return null;}
function summon(k){
  const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!isEnemy(S.board[r][c]))cells.push([r,c]);
  if(!cells.length)return;const [r,c]=cells[rnd(cells.length)];const e=makeKind(k,S.turn);e.ry=r;S.board[r][c]=e;
}
function popAnnounce(msgs){if(S.bossAnnounce){msgs.push(`${S.bossAnnounce} が現れた！`);sfx('boss');delete S.bossAnnounce;}}
function enemyPhase(msgs){
  const all=()=>{const l=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const e=S.board[r][c];if(isEnemy(e))l.push([e,r,c]);}return l;};
  let total=0,pierce=0;const exploded=new Set();
  for(const [e,r,c] of all()){
    if(e.fresh||e.frz>0)continue;
    const a=enemyAtk(e),k=bhOf(e),D=EK[kindOf(e)]||{};total+=a.d;pierce+=a.p;
    if(D.st&&S.gold>0){const g=Math.min(S.gold,1+Math.floor(e.atk/2));S.gold-=g;msgs.push(`${D.icon} 💰を${g}盗まれた`);}
    if(D.sb&&S.armor>0){S.armor--;msgs.push(`${D.icon} 防御を1削られた`);}
    if(k==='golem')e.rest=!e.rest;
    if(k==='dragon'){e.ch=(e.ch||0)+1;if(e.ch>=3){e.ch=0;msgs.push('🐉 ブレス！');}}
    if(k==='abyss'){e.ch=(e.ch||0)+1;if(e.ch>=3){e.ch=0;msgs.push('👁️ 深淵の波動！');}}
    if(k==='bomb'){e.cnt=(e.cnt||4)-1;if(e.cnt<=0){exploded.add(r*N+c);msgs.push('💣 爆発！');}}
  }
  const sum=total+pierce;
  if(sum>0){const bl=Math.min(S.armor,total);S.armor-=bl;let d=total-bl+pierce;if(d>0&&hasR('greed'))d++;if(d>0&&hasR('amulet'))d--;S.hp-=d;
    if(d>1&&hasR('mirror')){const es=all().map(x=>x[0]).filter(x=>!x.fresh);if(es.length){const t=es[rnd(es.length)],rd=Math.floor(d/2);applyDmg(t,rd);t.hit=performance.now();msgs.push(`🪞 ${rd}ダメージを返した`);}}
    msgs.push(`敵の攻撃${sum}`+(bl?`（防御${bl}）`:'')+(pierce?`（すり抜け${pierce}）`:'')+(d?` → HP-${d}`:''));
    {const hd=hurtDelay()*1000,gd=bl&&d>0?90:0;HURT_AT=performance.now()+hd+gd;
     if(bl||d<=0)setTimeout(()=>{if(bl)flash('bAr');sfx('guard');},hd);
     if(d>0){const hr=d/Math.max(1,S.maxHp),hl=hr>=.25?2:hr>=.1?1:0;setTimeout(()=>{shake();flash('bHp');sfx('hurt',hl);},hd+gd);}}}
  if(exploded.size){sfx('boom');S._boom=true;removeAndFill(exploded);}
  const live=all();
  for(const [e,r,c] of live){
    if(e.fresh||e.frz>0)continue;const k=bhOf(e);
    if(k==='kraken')e.armor=Math.min(10,e.armor+1);
    if(k==='abyss'){e.armor=Math.min(10,e.armor+1);e.sm=(e.sm||0)+1;if(e.sm>=2){e.sm=0;const pool=['skel','zombie','spider','ghost','golem','shaman'];summon(pool[rnd(pool.length)]);msgs.push('👁️ 手下を呼び出した！');}}
    if(k==='vampire'){e.hp=Math.min(e.maxHp,e.hp+2);e.sm=(e.sm||0)+1;if(e.sm>=3){e.sm=0;summon('bat');msgs.push('🧛 コウモリを呼んだ！');}}
  }
  for(const [e,r,c] of live){
    if(e.fresh||e.frz>0||S.board[r][c]!==e)continue;const D=EK[kindOf(e)]||{};e.age=(e.age||0)+1;
    if(D.rg)e.hp=Math.min(e.maxHp,e.hp+D.rg);
    if(D.hl)for(const q of neighbors(r,c)){const t=tileAt(q);if(isEnemy(t))t.hp=Math.min(t.maxHp,t.hp+D.hl);}
    if(D.au)e.armor=Math.min(D.au+(e.mini?4:0),e.armor+1);
    if(D.gr&&e.age%D.gr===0){e.atk++;}
    if(D.sh)e.ic=SHAPES[rnd(SHAPES.length)];
    if(D.sm&&e.age%D.sm[1]===0){let kk=D.sm[0];if(kk==='?'){const pool=Object.keys(rosterAt(floorOf()));kk=pool[rnd(pool.length)]||'skel';}summon(kk);msgs.push(`${D.icon} ${EK[kk].icon}${EK[kk].name}を呼んだ！`);}
    if(D.hc&&e.age>=D.hc[1]){const n=makeKind(D.hc[0],S.turn);n.ry=e.ry;S.board[r][c]=n;msgs.push(`${D.icon} から ${EK[D.hc[0]].icon}${EK[D.hc[0]].name}が生まれた！`);continue;}
    if(D.fl&&e.age>=D.fl){S.board[r][c]={t:'coin',ry:e.ry};msgs.push(`${D.icon} ${D.name}は去っていった`);if(kindOf(e)==='cat'){addGold(15);msgs.push('🐈‍⬛ なんだか運がいい… 💰+15');}}
  }
  if(S.anom==='rust'&&S.armor>0)S.armor--;
  for(const [e] of live){
    if(bhOf(e)!=='bat'||e.fresh||e.frz>0||!findTile(e))continue;
    const pos=findTile(e);if(!pos)continue;
    const opts=neighbors(pos[0],pos[1]).filter(q=>!isEnemy(tileAt(q)));if(!opts.length)continue;
    const q=opts[rnd(opts.length)],o=tileAt(q);S.board[q[0]][q[1]]=e;S.board[pos[0]][pos[1]]=o;e.ry=q[0];o.ry=pos[0];
  }
  for(const [e] of live)if(e.frz>0)e.frz--;
  for(const row of S.board)for(const t of row)if(t.fresh)delete t.fresh;
}

function applyDmg(e,d){if(e.armor>0){const a=Math.min(e.armor,d);e.armor-=a;d-=a;}e.hp-=d;}
function wouldDie(e,d){return d>=e.hp+e.armor;}
function gainXp(x){S.xp+=x;while(S.xp>=S.xpNeed){S.xp-=S.xpNeed;S.level++;S.xpNeed=Math.round(S.xpNeed*1.3)+8;S.pending.push('level');}}

/* ---------- board helpers ---------- */
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const adj=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]))===1;
const tileAt=p=>S.board[p[0]][p[1]];
function neighbors(r,c){const o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N)o.push([R,C]);}return o;}
function hasMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const g=groupOf(S.board[r][c].t);
    for(const a of neighbors(r,c)){if(groupOf(tileAt(a).t)!==g)continue;
      for(const b of neighbors(a[0],a[1])){if((b[0]!==r||b[1]!==c)&&groupOf(tileAt(b).t)===g)return true;}}}
  return false;
}
function rerollNonEnemies(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!isEnemy(S.board[r][c])){const t=randTile(S,true);t.ry=S.board[r][c].ry??r;S.board[r][c]=t;}}}
function ensureMove(){let i=0;while(!hasMove()&&i++<30)rerollNonEnemies();}
function removeAndFill(set){
  for(let c=0;c<N;c++){
    const keep=[];
    for(let r=N-1;r>=0;r--){if(!set.has(r*N+c)){const t=S.board[r][c];t.ry=(t.ry??r);keep.push(t);}}
    for(let i=0;i<keep.length;i++)S.board[N-1-i][c]=keep[i];
    const m=N-keep.length;
    for(let r=0;r<m;r++){const t=randTile(S,!!TUT);t.ry=r-m;S.board[r][c]=t;}
  }
}

/* ---------- turn ---------- */
let logTimer=null;
function log(msg){$('log').textContent=msg;clearTimeout(logTimer);logTimer=setTimeout(()=>{$('log').textContent='';},4000);}
function flash(id){const e=$(id);e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}
function shake(){const w=$('wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');}

const CB=[1,1,2,3,4];
function chainBonus(n){const t=bonusTier(n);return t<0?0:CB[t];}
function chainMult(n){const k=Math.max(0,n-3)+(S&&S.bless>0&&n>=3?3:0);return 1+.15*k+.012*k*k+(n>=4&&hasR('lantern')?.1:0)+(n>=4&&S&&S.anom==='wind'?.15:0);}
const fmtM=m=>(Math.round(m*10)/10).toFixed(1);
function chainDmg(cells,roll=1){const n=cells.length;let m=chainMult(n);
  if(S.cls==='dragoon')m=n<5?m*.5:chainMult(n+2);
  if(S.cls==='knight'&&S.maxArmor>0&&S.armor>=S.maxArmor)m*=1.5;
  if(hasR('trident')&&cells.filter(p=>tileAt(p).t==='sword').length>=3)m*=1.3;
  return Math.max(1,Math.round((S.baseDmg+cells.filter(p=>tileAt(p).t==='sword').length*S.weaponDmg)*m*roll));}
const MIXLOSS=.45;
const ROLLS=[.5,.75,1,1,1.25,1.5,2];
const lastEnemyOf=cells=>{for(let i=cells.length-1;i>=0;i--)if(isEnemy(tileAt(cells[i])))return cells[i];return null;};
function bonusTxtOf(n){const m=chainMult(n),b=chainBonus(n);return (m>1?`効果×${fmtM(m)}`:'')+(b?`・経験値+${b}`:'');}
function addGold(a){S.gold+=a;while(S.gold>=S.goldNeed){S.gold-=S.goldNeed;S.goldNeed=Math.round(S.goldNeed*1.12+24*(S.cls==='thief'?.8:1));S.pending.push('shop');}}
function commitChain(){
  const hp0=S.hp,full0=S.hp>=S.maxHp;
  const cells=chain.slice();chain=[];
  const first=tileAt(cells[0]);const g=groupOf(first.t);const types=cells.map(p=>tileAt(p).t);
  const remove=new Set();const msgs=[];const killsBefore=S.kills;const bonus=chainBonus(cells.length);let mult=chainMult(cells.length);
  if(g==='atk'){
    const swords=cells.filter(p=>tileAt(p).t==='sword').length;
    let roll=S.cls==='gambler'?ROLLS[rnd(ROLLS.length)]:1;if(hasR('dice')&&Math.random()<.15){roll*=2;msgs.push('🎲 会心！');}
    const dmg=chainDmg(cells,roll),lastE=S.cls==='hunter'?lastEnemyOf(cells):null;
    if(roll!==1)msgs.push(`🃏 ×${roll}`+(roll>=2?' 大当たり！':roll<1?' はずれ…':''));
    let killed=0,xp=0,hitN=0;const now=performance.now();
    for(const p of cells){const t=tileAt(p);
      if(t.t==='sword'){remove.add(p[0]*N+p[1]);continue;}
      hitN++;applyDmg(t,dmgTo(t,p===lastE?dmg*2:dmg));if(p===lastE)msgs.push(`🏹 とどめの一矢 ${dmg*2}`);
      if(t.hp<=0){remove.add(p[0]*N+p[1]);killed++;xp+=xpOf(t);}else t.hit=now;}
    S.kills+=killed;if(xp)gainXp(xp);relicKills(killed);
    msgs.push(hitN?`敵に${dmg}ダメージ${killed?`、${killed}体撃破`:''}`:`剣${swords}本を消費`);vampDrain(killed,msgs);
  }else{
    cells.forEach(p=>remove.add(p[0]*N+p[1]));
    const eff=(g,n)=>{
    if(g==='shield'&&S.cls==='zombie'){const h=Math.min(Math.round(n*mult),S.maxHp-S.hp);S.hp+=h;msgs.push(`🧟傷をふさいだ HP+${h}`);flash('bHp');}
    else if(g==='shield'){const add=Math.round(n*S.armorPer*mult*(hasR('crest')?1.5:1)),used=Math.min(add,S.maxArmor-S.armor);S.armor+=used;const over=add-used;
      if(over>0){S.shieldPts+=over;while(S.shieldPts>=S.shieldNeed){S.shieldPts-=S.shieldNeed;S.shieldNeed=Math.round(S.shieldNeed*1.25)+10;S.pending.push('shield');}}
      msgs.push(`防御+${used}`+(over?`（超過${over}は盾ポイントへ）`:''));flash('bAr');}
    else if(g==='potion'&&S.cls==='vampire'){const a=Math.round(n*mult);addGold(a);msgs.push(`🧪は口に合わない → 💰+${a}`);flash('bGd');}
    else if(g==='potion'){const heal=Math.round(n*S.healPer*mult),h=Math.min(heal,S.maxHp-S.hp),_hl=h>0&&S.run&&(S.run.heal=1),cl=S.cls==='cleric',sell=Math.floor((heal-h)/(cl?3:4))*(hasR('urn')?2:1);S.hp+=h;if(sell){if(cl){gainXp(sell);flash('bXp');}else{addGold(sell);flash('bGd');}}msgs.push(`HP+${h}`+(sell?`（余り→${cl?'✨経験値':'💰'}+${sell}）`:''));flash('bHp');}
    else if(g==='coin'){const a=Math.round(n*S.goldPer*mult);addGold(a);msgs.push(`お金+${a}`);flash('bGd');}
    };
    if(g==='mix'){const cnt={};cells.forEach(p=>{const t=tileAt(p).t;cnt[t]=(cnt[t]||0)+1;});const ty=Object.keys(cnt).length;if(ty>1){mult*=MIXLOSS;msgs.push('⚗️ 調合');}for(const k of ['shield','potion','coin'])if(cnt[k])eff(k,cnt[k]);}else eff(g,cells.length);
  }
  if(g==='atk'&&S.kills>killsBefore)sfx('kill',S.kills-killsBefore);else sfx('clear',g);
  if(bonus){gainXp(hasR('starfrag')?bonus*2:bonus);flash('bXp');}
  if(cells.length>=5){if(hasR('chalice')){addGold(4);msgs.push('🏆 💰+4');}if(hasR('clover'))gainXp(1);}
  if(mult>1)msgs.unshift('✨'+bonusTxtOf(cells.length));
  celebrate(cells,types,S.kills-killsBefore,bonus?'✨'+bonusTxtOf(cells.length):'');
  achChain(cells.length,g,[...remove].map(i=>S.board[(i/N)|0][i%N]).filter(isEnemy),hp0,full0);
  removeAndFill(remove);flushDeath(msgs);
  if(cells.length>=7&&hasR('frost')){S.board.flat().filter(isEnemy).forEach(e=>e.frz=Math.max(e.frz||0,1));msgs.push('🧊 霜が敵を凍らせた');}
  enemyPhase(msgs);popAnnounce(msgs);
  S.turn++;S.skills.forEach(s=>{if(s.cur>0)s.cur--;});if(S.bless>0)S.bless--;
  checkBoss(msgs);advanceFloor(msgs);achAfterTurn(hp0,S._boom);S._boom=false;
  log(msgs.join(' ／ '));
  if(S.hp<=0&&hasR('feather')&&!S.fUsed){S.fUsed=1;S.hp=Math.ceil(S.maxHp*.5);msgs.push('🪶 不死鳥の羽が燃え、よみがえった！');flash('bHp');}
  if(S.hp<=0&&S.revive){S.revive=0;S.hp=Math.ceil(S.maxHp*.5);msgs.push('🧟 ……起き上がった');popAnnounce(['🧟 ……起き上がった！（もう蘇れない）']);flash('bHp');}
  if(S.hp<=0){S.hp=0;updateAll();dying=true;setTimeout(()=>{dying=false;if(inGame)gameOver();},Math.max(popLeft()+150,HURT_AT-performance.now()+450));return;}
  ensureMove();saveGame();updateAll();showNextPending();tutAfterCommit();
}

/* ---------- skills ---------- */
function useSkill(i){
  const sk=S.skills[i];if(!sk||sk.cur>0||busy()||modalOpen||(TUT&&(TUT.lock||TSTEPS[TUT.i].wait!=='skill')))return;
  const now=performance.now();const remove=new Set();let msg='';const fx=[],kb=S.kills;
  const eachEnemy=f=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=S.board[r][c];if(isEnemy(t))f(t,r,c);}};
  switch(sk.id){
    case 'fire':{const d=SKD.fire();let k=0,xp=0;eachEnemy((t,r,c)=>{fx.push([r,c]);applyDmg(t,d);if(t.hp<=0){remove.add(r*N+c);k++;xp+=xpOf(t);}else t.hit=now;});S.kills+=k;if(xp)gainXp(xp);msg=`火球！全ての敵に${d}ダメージ${k?`、${k}体撃破`:''}`;break;}
    case 'heal':{const h=Math.min(Math.ceil(S.maxHp*0.4),S.maxHp-S.hp);S.hp+=h;msg=`治癒：HP+${h}`;flash('bHp');break;}
    case 'wall':{msg=`鉄壁：防御+${S.maxArmor-S.armor}`;S.armor=S.maxArmor;flash('bAr');break;}
    case 'alchemy':{let k=0;for(const row of S.board)row.forEach((t,c)=>{if(t.t==='shield'){row[c]={t:'coin',ry:t.ry};k++;fx.push([S.board.indexOf(row),c]);}});msg=`錬金：${k}枚を💰に`;break;}
    case 'arm':{let k=0;for(const row of S.board)row.forEach((t,c)=>{if(t.t==='potion'){row[c]={t:'sword',ry:t.ry};k++;fx.push([S.board.indexOf(row),c]);}});msg=`武装：${k}個を⚔️に`;break;}
    case 'quake':{rerollNonEnemies();msg='地殻変動：盤面が入れ替わった';break;}
    case 'thunder':{const d=SKD.thunder(),es=[];eachEnemy((t,r,c)=>es.push([t,r,c]));shuffle(es);let k=0,xp=0;const hit=es.slice(0,3);
      hit.forEach(([t,r,c])=>{fx.push([r,c]);applyDmg(t,d);if(t.hp<=0){remove.add(r*N+c);k++;xp+=xpOf(t);}else t.hit=now;});S.kills+=k;if(xp)gainXp(xp);msg=`雷撃！${hit.length}体に${d}ダメージ${k?`、${k}体撃破`:''}`;break;}
    case 'magnet':{let k=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c].t==='coin'){remove.add(r*N+c);k++;fx.push([r,c]);}const a=k*S.goldPer;addGold(a);flash('bGd');msg=`磁力：💰${k}枚を回収（+${a}）`;break;}
    case 'freeze':{let k=0;eachEnemy((t,r,c)=>{t.frz=2;k++;fx.push([r,c]);});msg=`凍結：${k}体の敵が凍りついた`;break;}
    case 'snipe':{const d=SKD.snipe();let tg=null,tr=0,tc=0;eachEnemy((t,r,c)=>{if(!tg||t.hp+t.armor>tg.hp+tg.armor){tg=t;tr=r;tc=c;}});
      if(!tg)msg='狙撃：敵がいない';else{fx.push([tr,tc]);applyDmg(tg,d);if(tg.hp<=0){remove.add(tr*N+tc);S.kills++;gainXp(xpOf(tg));msg=`狙撃！${EK[kindOf(tg)].name}を撃破`;}else{tg.hit=now;msg=`狙撃！${EK[kindOf(tg)].name}に${d}ダメージ`;}}break;}
    case 'crush':{let k=0;eachEnemy((t,r,c)=>{if(t.armor>0){t.armor=0;k++;fx.push([r,c]);}});msg=`粉砕：${k}体の装甲を破壊`;break;}
    case 'bless':{S.bless=3;msg='祝福：3ターン チェーンが3つ長い扱いに';break;}
    case 'execute':{let k=0,xp=0;eachEnemy((t,r,c)=>{if(!t.boss&&t.hp<=execLine(t)){fx.push([r,c]);remove.add(r*N+c);k++;xp+=xpOf(t);}});S.kills+=k;xp=Math.round(xp*1.5);if(xp)gainXp(xp);msg=k?`処刑：${k}体撃破（経験値1.5倍）`:'処刑：対象なし';break;}
  }
  if(S.run)S.run.sk=(S.run.sk||0)+1;
  sk.cur=hasR('hourglass')?Math.max(2,Math.round(sk.cd*.85)):sk.cd;{const dr=vampDrain(S.kills-kb);if(dr)msg+=' ／ '+dr;}sfx('skill');skillFx(sk.id,fx,S.kills-kb);
  if(!TUT){achStat('skills');achKills([...remove].map(i=>S.board[(i/N)|0][i%N]).filter(isEnemy));
    if(sk.id==='thunder'&&S.kills-kb>=3)unlock('thunder3');if(sk.id==='freeze'&&S.board.flat().some(e=>isEnemy(e)&&kindOf(e)==='dragon'))unlock('s_frzdragon');}

function recordBest(){
  const prev=best||{turn:-1,kills:0,level:0,chain:0};
  const pf=prev.floor||(prev.turn>=0?1+Math.floor(prev.turn/2):0),F=floorOf();
  const isNew=F>pf||(F===pf&&S.turn>prev.turn),chain=Math.max(prev.chain||0,S.maxChain||0),cleared=Math.max(prev.cleared||0,S.cleared||0);
  const nb=isNew?{turn:S.turn,kills:S.kills,level:S.level,floor:F,chain,cleared}:{...prev,chain,cleared};
  if(isNew||chain!==(prev.chain||0)||cleared!==(prev.cleared||0)){best=nb;try{localStorage.setItem(LS_BEST,JSON.stringify(best));}catch(e){}cloudWrite('best',best);}
  return isNew;
}

  S=s;startGame();
}

/* cloud (claude.ai artifact db) */
const cq={};
const cref=name=>DB.doc('data/users/'+UID+'/'+name);
function cloudWrite(name,data){if(!cloudOn)return;const q=cq[name]||(cq[name]={busy:false,next:null});q.next=data;if(!q.busy)pump(name);}
async function pump(name){
  const q=cq[name];q.busy=true;
  while(q.next!==null&&cloudOn){const d=q.next;q.next=null;
    const run=()=>d==='DEL'?cref(name).delete():cref(name).set(d);
    try{await run();}catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await run();}catch(e2){}}
      else{cloudOn=false;setCloud('端末内にのみ保存中');}}
  }
  q.busy=false;
}
function setCloud(t){$('cloud').textContent='セーブ: '+t;}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setCloud('この端末のブラウザに保存');return;}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setCloud('この端末のブラウザに保存');return;}
    const id=await user.id();if(!id){setCloud('この端末のブラウザに保存');return;}
    DB=db;UID=id;
    const timer=setTimeout(()=>setCloud('クラウドに接続できません（端末に保存中）'),10000);
    const [sv,bs,ac]=await Promise.all([cref('save').get(),cref('best').get(),cref('ach').get()]);
    clearTimeout(timer);cloudOn=true;setCloud('クラウドに自動保存（他の端末でも続きから遊べます）');
    // merge save
    let localTs=0;try{localTs=savedJson?JSON.parse(savedJson).ts||0:0;}catch(e){}
    if(sv.exists){const d=sv.data();
      if(d&&typeof d.json==='string'&&(d.ts||0)>localTs&&!inGame){savedJson=d.json;try{localStorage.setItem(LS_SAVE,d.json);}catch(e){}}
      else if(savedJson&&localTs>(d.ts||0))cloudWrite('save',{json:savedJson,ts:localTs});}
    else if(savedJson)cloudWrite('save',{json:savedJson,ts:localTs});
    if(bs.exists){const b=bs.data();if(b&&(!best||b.turn>best.turn)){best={turn:b.turn,kills:b.kills,level:b.level,chain:Math.max(b.chain||0,best&&best.chain||0)};try{localStorage.setItem(LS_BEST,JSON.stringify(best));}catch(e){}}
      else if(best&&b&&best.turn>b.turn)cloudWrite('best',best);}
    else if(best)cloudWrite('best',best);
    try{if(ac.exists){const d=ac.data();if(d&&typeof d.json==='string'&&achMerge(JSON.parse(d.json))){try{localStorage.setItem(LS_ACH,JSON.stringify(ACH));}catch(e){}}cloudWrite('ach',{json:JSON.stringify(ACH)});}else if(achCount())cloudWrite('ach',{json:JSON.stringify(ACH)});}catch(e){}
    refreshTitle();
  }catch(e){setCloud('この端末のブラウザに保存');}
}

function drawBanner(now,cs){
  if(!BANNER)return;const e=(now-BANNER.t0)/BANNER_MS;if(e>=1){BANNER=null;return;}if(e<0)return;
  const W=cv.width,al=e<.2?e/.2:e>.74?(1-e)/.26:1;
  ctx.save();ctx.globalAlpha=al*.78;ctx.fillStyle='#000';ctx.fillRect(0,W*.28,W,W*.44);ctx.globalAlpha=al;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const MF='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif';
  const fit=(t,f,wt)=>{ctx.font=`${wt} ${f}px ${MF}`;const w=ctx.measureText(t).width;if(w>W*.9){f*=W*.9/w;ctx.font=`${wt} ${f}px ${MF}`;}return f;};
  let f=fit(BANNER.top,cs*.3,800);ctx.fillStyle='#bbb';ctx.fillText(BANNER.top,W/2,W*.36);
  f=fit(BANNER.main,cs*.52,900);ctx.lineWidth=f*.18;ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(BANNER.main,W/2,W*.47+(1-al)*cs*.1);ctx.fillStyle=BANNER.col;ctx.fillText(BANNER.main,W/2,W*.47+(1-al)*cs*.1);
  if(BANNER.sub){f=fit(BANNER.sub,cs*.24,700);ctx.fillStyle='#eee';ctx.fillText(BANNER.sub,W/2,W*.6);}
  ctx.restore();
}

function achMerge(o){
  if(!o||!o.u)return false;const before=JSON.stringify(ACH),ra=ACH.resetAt||0,ro=o.resetAt||0,R=Math.max(ra,ro),u={};
  for(const src of [ACH.u,o.u])for(const k in src)if(src[k]>=R&&(!u[k]||src[k]<u[k]))u[k]=src[k];
  let st;if(ra===ro){st={...ACH.st};for(const k in(o.st||{}))st[k]=Math.max(st[k]||0,o.st[k]||0);}else st=ra>ro?{...ACH.st}:{...(o.st||{})};
  ACH={v:1,u,st,...(R?{resetAt:R}:{})};return JSON.stringify(ACH)!==before;
}

const LS_RUNS='dchain_runs_v1';let RUNS=[];

const VC={c1:'#3987e5',c2:'#d95926',c3:'#199e70',c4:'#c98500',grid:'#3a3238',ink:'#ece4d8',ink2:'#a99fae',surf:'#211a25'};
const CLS_COL={warrior:VC.c1,thief:VC.c2,mage:VC.c3,cleric:VC.c4,vampire:'#d55181',zombie:'#0ca30c',hunter:'#9085e9',dragoon:'#9085e9',gambler:'#9085e9',knight:'#9085e9',alchemist:'#9085e9'};
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmtD=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}`;};
const placeOf=f=>f%20===0?bossFloorName(f):zoneAt(f).name;
/* rounded-top bar anchored to the baseline */
function barPath(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}
function hbarPath(x,y,w,h,r){if(w<=0)return '';r=Math.min(r,h/2,w);return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`;}
function chartFloors(){
  const R=RUNS.slice(-30);if(!R.length)return '<p class="vz-empty">冒険を終えると、ここに記録が並びます。</p>';
  const W=340,H=180,L=34,Rt=8,T=16,B=20,iw=W-L-Rt,ih=H-T-B,maxF=Math.max(100,...R.map(r=>r.f)),top=Math.ceil(maxF/50)*50;
  const y=v=>T+ih-(v/top)*ih,bw=iw/R.length,gap=Math.min(2,bw*.25);
  let g='';for(let v=0;v<=top;v+=50)g+=`<line x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}" stroke="${VC.grid}" stroke-width="1"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end" class="vz-ax">B${v}F</text>`;
  g+=`<line x1="${L}" x2="${W-Rt}" y1="${y(100)}" y2="${y(100)}" stroke="${VC.c4}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${L+4}" y="${y(100)-4}" class="vz-ax" fill="${VC.c4}">目標 B100F</text>`;
  let bars='',best=0,pts=[],prev=null;
  R.forEach((r,i)=>{const x=L+i*bw+gap/2,w=Math.max(1,bw-gap);
    bars+=`<path d="${barPath(x,y(r.f),w,T+ih-y(r.f),3)}" fill="${VC.c1}" opacity=".85"/>`;
    if(r.cl)bars+=`<text x="${x+w/2}" y="${y(r.f)-3}" text-anchor="middle" font-size="9">👑</text>`;
    bars+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-run="${i}"/>`;
    best=Math.max(best,r.f);const px=L+i*bw+bw/2;pts.push(`${prev===null?'M':'L'}${px},${y(best)}`);prev=best;});
  const line=`<path d="${pts.join('')}" fill="none" stroke="${VC.c2}" stroke-width="2" stroke-linejoin="round"/><circle cx="${L+(R.length-.5)*bw}" cy="${y(best)}" r="4" fill="${VC.c2}" stroke="${VC.surf}" stroke-width="2"/>`;
  return `<div class="vz-leg"><span><i style="background:${VC.c1}"></i>到達した階</span><span><i style="background:${VC.c2};height:2px"></i>自己ベスト</span></div>
    <svg id="vzFloors" viewBox="0 0 ${W} ${H}" class="vz-svg">${g}${bars}${line}<text x="${L}" y="${H-5}" class="vz-ax">${R.length>1?'古い':''}</text><text x="${W-Rt}" y="${H-5}" text-anchor="end" class="vz-ax">最新</text></svg>
    <p id="vzRun" class="vz-cap">棒をタップすると、その回の詳細が出ます</p>`;
}
function chartRows(rows,unit,valW=96){
  if(!rows.length)return '<p class="vz-empty">まだ記録がありません。</p>';
  const W=320,rh=30,L=118,iw=W-L-valW,max=Math.max(1,...rows.map(r=>r.v));
  let s='';rows.forEach((r,i)=>{const yy=i*rh+4,w=r.v/max*iw;
    s+=`<text x="${L-6}" y="${yy+17}" text-anchor="end" class="vz-lb">${esc(r.label)}</text>`+
      (r.v>0?`<path d="${hbarPath(L,yy+5,Math.max(2,w),rh-12,3)}" fill="${r.col||VC.c1}"/>`:'')+
      `<text x="${L+Math.max(2,w)+6}" y="${yy+17}" class="vz-val">${esc(r.txt!==undefined?r.txt:r.v+unit)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${rows.length*rh+6}" class="vz-svg">${s}</svg>`;
}
function showStats(back,bl){
  const runs=RUNS,games=Math.max(ACH.st.games||0,runs.length),clears=Math.max(runs.filter(r=>r.cl).length,best&&best.cleared?1:0);
  const kills=ACH.st.kills||0,bf=bestFloor(),chainMax=Math.max(best&&best.chain||0,...runs.map(r=>r.ch),0);
  const last10=runs.slice(-10),prev10=runs.slice(-20,-10),avg=a=>a.length?a.reduce((x,r)=>x+r.f,0)/a.length:0;
  const a1=avg(last10),a0=avg(prev10),diff=prev10.length?Math.round(a1-a0):null;
  const tile=(lab,val,sub)=>`<div class="vz-tile"><small>${lab}</small><b>${val}</b>${sub?`<small>${sub}</small>`:''}</div>`;
  const ks=Object.keys(CLASSES).filter(k=>!CLASSES[k].hidden||classOk(k)||RUNS.some(r=>r.c===k));
  const clsRows=ks.map(k=>{const c=CLASSES[k],rr=runs.filter(r=>r.c===k),ok=classOk(k);
    return {label:`${c.ic} ${c.n}`,v:rr.length,col:CLS_COL[k],txt:!ok?'🔒':rr.length?`${rr.length}回・B${Math.max(...rr.map(r=>r.f))}F${rr.some(r=>r.cl)?'・👑'+rr.filter(r=>r.cl).length:''}`:'—'};});
  const monRows=BEAST_ORDER.filter(k=>UNL.kills[k]).map(k=>({label:`${EK[k].icon} ${EK[k].name}`,v:UNL.kills[k]})).sort((a,b)=>b.v-a.v);
  const deathMap={};runs.filter(r=>!r.e&&!(r.cl&&r.f<=100)).forEach(r=>{const p=placeOf(r.f);deathMap[p]=(deathMap[p]||0)+1;});
  const deathRows=Object.entries(deathMap).map(([p,v])=>({label:p,v,col:VC.c2})).sort((a,b)=>b.v-a.v).slice(0,8);
  openModal(`${pgHead('📊 戦績',bl)}<p style="text-align:center;margin:0 0 4px;color:#d9cfc2;font-size:14.5px">👤 ${esc(getName())}</p>
    <div class="vz-tiles">${tile('冒険',games+'<span>回</span>')}${tile('👑 クリア',clears+'<span>回</span>')}${tile('最深',bf?`B${bf}F`:'-')}
      ${tile('撃破',kills+'<span>体</span>')}${tile('🔗 最長',chainMax+'<span>つ</span>')}
      ${tile('最近10回',last10.length?`B${Math.round(a1)}F`:'-',diff===null?'':diff>0?`<span class="up">▲ ${diff}F</span>`:diff<0?`<span class="dn">▼ ${-diff}F</span>`:'')}</div>
    <h3 class="vz-h">📈 到達階層</h3>${chartFloors()}
    <h3 class="vz-h">🧑‍🤝‍🧑 職業</h3>${chartRows(clsRows,'回',118)}
    <h3 class="vz-h">⚔️ 倒した魔物</h3>${chartRows(monRows,'体')}
    <h3 class="vz-h">🪦 倒れた場所</h3>${chartRows(deathRows,'回')}
    <button class="opt" id="vzRep" style="text-align:center">📝 戦績をコピー</button>`);
  const R=RUNS.slice(-30),fl=$('vzFloors');
  if(fl)fl.querySelectorAll('rect[data-run]').forEach(el=>el.onclick=()=>{const r=R[+el.dataset.run],c=CLASSES[r.c]||CLASSES.warrior;
    fl.querySelectorAll('rect[data-run]').forEach(x=>x.setAttribute('fill','transparent'));el.setAttribute('fill','rgba(255,255,255,.08)');
    $('vzRun').innerHTML=`${fmtD(r.d)}　${c.ic}${c.n}　<b>B${r.f}F</b>（${placeOf(r.f)}）${r.cl?'　👑':''}<br>${r.t}ターン・撃破${r.k}・Lv${r.l}・最長${r.ch}チェーン${r.e?'・あきらめた':''}`;});
  copyBtn('vzRep',reportText);$('pgBack').onclick=back||closeModal;
}

/* ---------- long-press info ---------- */
const LP_MS=420;
function showTip(html,x,y){
  const t=$('tip');t.innerHTML=html;t.classList.remove('hidden');
  const w=t.offsetWidth,h=t.offsetHeight,W=innerWidth,H=innerHeight;
  let L=Math.max(8,Math.min(W-w-8,x-w/2)),T=y-h-28;if(T<8)T=Math.min(H-h-8,y+28);
  t.style.left=L+'px';t.style.top=T+'px';
  vib(15);
}
function hideTip(){$('tip').classList.add('hidden');}
function attachLP(el,html,onTap){
  let tm=null,shown=false,sx=0,sy=0,down=false;
  let moved=false;
  el.addEventListener('pointerdown',e=>{down=true;shown=false;moved=false;sx=e.clientX;sy=e.clientY;clearTimeout(tm);try{el.setPointerCapture(e.pointerId);}catch(_){}
    tm=setTimeout(()=>{if(!down)return;shown=true;showTip(html(),sx,sy);},LP_MS);});
  el.addEventListener('pointermove',e=>{if(down&&!shown&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=true;clearTimeout(tm);}});
  el.addEventListener('pointerup',()=>{const was=down;down=false;clearTimeout(tm);if(shown){hideTip();shown=false;}else if(was&&!moved&&onTap)onTap();});
  el.addEventListener('pointercancel',()=>{down=false;clearTimeout(tm);if(shown){hideTip();shown=false;}});
}
const tipHead=(ic,name)=>`<div class="th">${ic} ${name}</div>`;
function tileInfo(p){
  const t=tileAt(p);
  switch(t.t){
    case 'sword':return tipHead('⚔️','剣')+`💀（敵）と一緒につなげます。<br>つないだ敵<b>全員</b>に「基礎${S.baseDmg}＋剣の本数×${S.weaponDmg}」のダメージ。<br>例：剣2本なら<b>${S.baseDmg+2*S.weaponDmg}</b>ダメージ<br>長くつなぐほど 倍率アップ（4つ×1.2／7つ×1.8／10つ×2.6）`;
    case 'shield':return tipHead('🛡️','盾')+`1枚につき防御+${S.armorPer}（最大${S.maxArmor}）。<br>防御は敵の攻撃を先に受け止めます。<br>あふれた分は盾ポイント（${S.shieldPts}/${S.shieldNeed}）になり、たまると防具を強化できます。`;
    case 'potion':return tipHead('🧪','回復薬')+`1個につきHP+${S.healPer}（最大HP${S.maxHp}まで）。<br>回復しきれなかった分は 半分が💰になります。`;
    case 'coin':return tipHead('💰','お金')+`1枚につき+${S.goldPer}。<br>${S.goldNeed}たまるとショップで強化を1つ選べます（今${S.gold}）。`;
    case 'skull':{
      const k=kindOf(t),d=EK[k];let st='';
      if(t.fresh)st+='出てきたばかり（次のターンから行動）<br>';
      if(t.frz>0)st+=`❄ 凍結中（あと${t.frz}ターン動けない）<br>`;
      if(k==='golem')st+=t.rest?'💤 次のターンは休み<br>':'次のターンは攻撃してくる<br>';
      if(k==='dragon')st+=`🔥 ブレスまで あと${3-(t.ch||0)}ターン（${t.atk*3}ダメージ）<br>`;
      if(k==='bomb')st+=`💣 あと${t.cnt}ターンで爆発（${t.boom}ダメージ）<br>`;
      if(k==='abyss')st+=`🌀 波動まで あと${3-(t.ch||0)}ターン（${Math.round(t.atk*2.5)}ダメージ）<br>`;
      return tipHead(d.icon,(t.elite?'⭐強い':'')+d.name+(t.boss?'（ボス）':''))+
      `HP <b style="color:#ff6b6b">${t.hp}</b>/${t.maxHp}　攻撃 <b style="color:#ffd54a">${k==='bomb'?'-':t.atk}</b>　装甲 <b style="color:#7fc4ff">${t.armor}</b><br>${d.desc}<br>${st}`+
      (t.elite?'⭐ 強化個体：HP・攻撃・装甲が高いが、経験値も多い<br>':'')+`倒すには合計<b>${t.hp+t.armor}</b>ダメージ${k==='ghost'?'（剣は半分しか効かない）':''}。経験値+${xpOf(t)}`;}
  }
  return '';
}
function skillInfo(i){
  const s=S.skills[i];

  const d=SKILLS[s.id];
  return tipHead(d.icon,d.name)+`${skillDesc(s.id)}${d.scale?'<br><small>（威力は攻撃力とターン数に合わせて上がる）</small>':''}<br>再使用まで${s.cd}ターン ／ ターンを消費しません<br>`+(s.cur>0?`<span style="color:#f99">あと${s.cur}ターンで使用可能</span>`:'<span style="color:#8f8">今すぐ使えます（タップで使用）</span>');
}

};
