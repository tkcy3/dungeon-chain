<style>

:root{--mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP",serif}
@keyframes flick{0%,100%{opacity:.88}23%{opacity:1}41%{opacity:.8}58%{opacity:.96}77%{opacity:.84}}
#story{position:fixed;inset:0;z-index:30;background:#040304;display:flex;align-items:center;justify-content:center;padding:28px;transition:opacity 1.4s}
#story.fade{opacity:0}
#story .lantern{position:absolute;left:50%;top:48%;width:150vmin;height:150vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,168,84,.15) 0,rgba(255,140,60,.06) 26%,transparent 58%);animation:flick 3.2s infinite;pointer-events:none}
#storyText{position:relative;font-family:var(--mincho);font-size:min(18px,4.8vw);line-height:2.2;color:#d8cdbd;text-align:center;max-width:22em;letter-spacing:.07em;transition:opacity .9s}
#storyText.out{opacity:0}
#storyText .ln{opacity:0;animation:lnIn 1.8s ease forwards;white-space:nowrap}
#mbox .em{color:#f0d9a8;font-size:17px}
#storyText .em{font-size:min(22px,6vw);color:#f0d9a8;text-shadow:0 0 14px rgba(255,170,90,.35)}
@keyframes lnIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#storyHint{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:12px;color:#6d6458;opacity:0;transition:opacity 1.2s;letter-spacing:.2em}
#storySkip{position:absolute;top:14px;right:14px;background:none;border:1px solid #352e2b;color:#81776b;border-radius:8px;padding:6px 12px;font-size:13px;z-index:2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0a0c radial-gradient(ellipse 120% 70% at 50% 0%,#1b1916 0%,#0f0e10 55%,#08080a 100%) fixed;color:#eee;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100dvh;height:100vh;display:flex;flex-direction:column;align-items:center;padding:6px 8px;gap:5px;max-width:520px;margin:0 auto}
@supports(height:100dvh){#app{height:100dvh}}
#top{width:100%;display:flex;align-items:center;gap:5px;font-size:13px}
#top .st{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding-right:8px}
#top .it{display:inline-flex;align-items:baseline;gap:5px;height:30px;line-height:30px;white-space:nowrap}
#top .it i{font-style:normal;font-size:14px;color:#cbb;line-height:30px}
#top .it b.fl{min-width:3.3em;color:#ffe08a}
#top .it b.flash{animation:fl .6s}
#top .it b{color:#fff;font-size:21px;line-height:30px;font-variant-numeric:tabular-nums;font-family:system-ui,-apple-system,"Roboto",sans-serif;display:inline-block;min-width:1.9em;text-align:left}
.ibtn{position:relative;background:#2a2230;color:#eee;border:1px solid #4a3d52;border-radius:8px;padding:5px 7px;font-size:15px;flex:none}
.ibtn .vb{position:absolute;right:2px;bottom:2px;display:flex;align-items:flex-end;gap:1px;pointer-events:none}.ibtn .vb b{width:3px;background:#5d4a69;border-radius:1px}.ibtn .vb b:nth-child(1){height:4px}.ibtn .vb b:nth-child(2){height:7px}.ibtn .vb b:nth-child(3){height:10px}
.ibtn .vb.l1 b:nth-child(-n+1),.ibtn .vb.l2 b:nth-child(-n+2),.ibtn .vb.l3 b{background:#f0c75a}
.ibtn.pop{animation:ipop .35s}@keyframes ipop{40%{transform:scale(1.25)}}
.ibtn.offx::after{content:'';position:absolute;left:18%;right:18%;top:50%;height:2px;background:#f77;transform:rotate(-35deg)}
#bars{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bar{position:relative;height:20px;background:#241c27;border-radius:6px;overflow:hidden;border:1px solid #3a2f3e}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .25s}
.bar span{position:relative;display:block;text-align:center;font-size:11.5px;line-height:18px;font-weight:600;text-shadow:0 1px 2px #000}
.bar.hp{grid-column:1/3;height:22px}.bar.hp span{line-height:20px;font-size:12.5px}
.hp .fill{background:linear-gradient(#d0434f,#8e1f2b)}
.ar .fill{background:linear-gradient(#4f8fd6,#24527f)}
.xp .fill{background:linear-gradient(#5cc46b,#2c7a39)}
.gd .fill{background:linear-gradient(#e0b844,#8f6b12)}
.sh .fill{background:linear-gradient(#55c6d3,#21707a)}
.bar.flash{animation:fl .4s}
@keyframes fl{0%{filter:brightness(2.2)}100%{filter:none}}
#stats .clsChip{color:#f0d9a8;border:1px solid #5d4a69;border-radius:999px;padding:0 6px;max-width:9em;overflow:hidden;text-overflow:ellipsis}
#stats{width:100%;font-size:11px;white-space:nowrap;overflow:hidden;color:#b9a9bd;display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px}
#preview{width:100%;height:42px;overflow:hidden;font-size:12.5px;white-space:nowrap;text-align:center;background:#1c161f;border-radius:8px;padding:3px 6px;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
#preview .sub{font-size:11.5px;color:#c9a}
#wrap{position:relative}
#tutSkip{position:absolute;bottom:-30px;right:0;z-index:3;background:rgba(22,18,24,.92);border:1px solid #5a4a63;color:#d7c9b8;border-radius:8px;padding:4px 10px;font-size:12px}
#board{display:block;touch-action:none;border-radius:12px;background:#1a141c;box-shadow:0 0 0 2px #2c2330}
#wrap.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
#log{width:100%;font-size:11.5px;color:#e9a;text-align:center;height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#skills{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sk{position:relative;background:#2a2230;border:1px solid #574663;border-radius:10px;color:#eee;padding:5px 2px;font-size:11px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sk .ic{font-size:20px;line-height:1.1}
.sk:disabled{opacity:.45}
.sk.aiming{border-color:#ff6a4a!important;box-shadow:0 0 12px rgba(255,90,60,.7);animation:aimbtn 1s ease-in-out infinite}@keyframes aimbtn{50%{box-shadow:0 0 4px rgba(255,90,60,.3)}}
.sk.empty{border-style:dashed;color:#665}
.sk .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:10px;font-size:13px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(8,5,10,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#modal{z-index:15}
/* 防具の強化＝鍛冶（鉄と火花） */
.box.m-smith{position:relative;overflow-x:hidden;border:2px solid #6d7682;background:radial-gradient(110% 55% at 50% 105%,rgba(255,110,40,.30),rgba(255,110,40,0) 70%),linear-gradient(180deg,#2b2f36,#1e2126)}
.smithhd{display:flex;align-items:center;justify-content:center;gap:4px;margin:2px 0 8px;font-size:46px;line-height:1}
.smithhd .hm{display:inline-block;transform-origin:85% 85%;animation:hammer 1.1s ease-in-out infinite}
@keyframes hammer{0%,60%,100%{transform:rotate(0)}22%{transform:rotate(28deg)}36%{transform:rotate(-22deg)}46%{transform:rotate(-14deg)}}
.smithhd small{font-size:15px;color:#9fb6d8;font-weight:700;margin-left:10px;align-self:flex-end}
.box.m-smith .opt{background:linear-gradient(180deg,#4a515c,#363b44);border:1px solid #808a97;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.box.m-smith .opt small{color:#cdd6e2}
.box.m-smith .opt.got{animation:gotsm .45s ease-in forwards}
@keyframes gotsm{25%{background:#c8723a;box-shadow:0 0 20px rgba(255,140,60,.9)}100%{transform:scale(.92);opacity:0}}
.spark{position:fixed;z-index:40;width:5px;height:5px;border-radius:50%;background:#ffb347;box-shadow:0 0 6px #ff8a2a;pointer-events:none;transition:transform .45s cubic-bezier(.2,.7,.4,1),opacity .45s}
/* レベルアップ＝自分の成長（光・才能カード）／ショップ＝行商人から買う（木の棚・値札） */
.box.m-lv{position:relative;overflow-x:hidden;border-color:#c9a24a;background:radial-gradient(120% 60% at 50% 0%,rgba(255,214,110,.30),rgba(255,214,110,0) 70%),#211a25;box-shadow:0 0 30px rgba(255,200,90,.25)}
.m-lv .rays{position:absolute;left:50%;top:-160px;width:520px;height:520px;margin-left:-260px;pointer-events:none;opacity:.16;background:repeating-conic-gradient(from 0deg,#ffe08a 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:rays 18s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.lvnum{position:relative;display:flex;align-items:baseline;justify-content:center;gap:10px;margin:2px 0 10px;font-weight:800;color:#f6dc92;text-shadow:0 0 14px rgba(255,200,80,.6)}
.lvnum small{font-size:15px;color:#cdb98a;font-weight:600}.lvnum .o{font-size:24px;color:#9d8a6a;text-shadow:none}.lvnum i{font-style:normal;color:#9d8a6a;font-size:20px}.lvnum b{font-size:44px;animation:lvpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes lvpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.box.m-lv .opt{position:relative;background:linear-gradient(180deg,#3b2f26,#2a2130);border:1px solid #b8903e;box-shadow:inset 0 0 12px rgba(255,210,110,.12)}
.box.m-lv .opt.got{animation:gotlv .45s ease-in forwards;border-color:#ffe08a;box-shadow:0 0 24px rgba(255,220,120,.8)}
@keyframes gotlv{40%{transform:scale(1.04)}100%{transform:translateY(-40px) scale(.9);opacity:0}}
.box.m-shop{position:relative;overflow-x:hidden;border:2px solid #8a5a2b;background:radial-gradient(90% 40% at 50% 0%,rgba(255,170,70,.22),rgba(255,170,70,0) 70%),repeating-linear-gradient(180deg,#2e1f14 0 46px,#271a10 46px 48px)}
.shophd{display:flex;align-items:center;gap:10px;margin:0 0 6px}.shophd .mc{font-size:46px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.shophd .bub{position:relative;flex:1;background:#f3e6cc;color:#3a2716;border-radius:12px;padding:8px 12px;font-size:15.5px;font-weight:600}
.shophd .bub::before{content:'';position:absolute;left:-8px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#f3e6cc;border-left:0}
.shophd .purse{font-size:15px;color:#ffd56a;font-weight:700;white-space:nowrap}
.ptag{display:inline-block;background:#c9a05a;color:#3a2716;font-size:14px;font-weight:700;padding:3px 10px 3px 14px;border-radius:4px 10px 10px 4px;position:relative;box-shadow:0 2px 0 #6b4a22}.ptag::before{content:'';position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#3a2716}.ptag b{color:#5a2c00}
.box.m-shop .opt{background:linear-gradient(180deg,#5a3d24,#4a3220);border:1px solid #8a5a2b;border-bottom:5px solid #2a1a0e;border-radius:8px}
.box.m-shop .opt small{color:#e2cfae}
.box.m-shop .opt.got{animation:gotshop .45s ease-in forwards}
@keyframes gotshop{30%{transform:scale(1.04);background:#7a5a2a}100%{transform:scale(.9);opacity:0}}
.coinfly{position:fixed;z-index:40;font-size:20px;pointer-events:none;transition:transform .42s cubic-bezier(.3,.6,.4,1),opacity .42s}

.vz-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.vz-tile{background:#2a2230;border:1px solid #3d3242;border-radius:10px;padding:7px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.vz-tile small{font-size:12.5px;color:#b9adc0}.vz-tile b{font-size:21px;color:#ece4d8;font-variant-numeric:tabular-nums}.vz-tile b span{font-size:11px;font-weight:600;margin-left:1px;color:#c9bfcf}
.vz-tile .up{color:#7fd88a}.vz-tile .dn{color:#e9a08a}
.vz-h{font-size:15.5px;margin:16px 0 6px;color:#d9cfc2;font-family:var(--mincho);font-weight:600;letter-spacing:.05em}
.vz-svg{width:100%;height:auto;display:block}
.vz-ax{font-size:11.5px;fill:#b9adc0}.vz-lb{font-size:13.5px;fill:#ece4d8}.vz-val{font-size:12.5px;fill:#d9cfc2}
.vz-leg{display:flex;gap:14px;font-size:11px;color:#c9bfcf;margin:2px 0}.vz-leg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.vz-cap{font-size:11.5px;color:#c9bfcf;text-align:center;min-height:34px;margin:2px 0 0}.vz-empty{font-size:12px;color:#8f8396;text-align:center;padding:10px 0}
.nmrow{display:flex;align-items:center;gap:6px;margin:6px 0 10px}.nmrow label{font-size:12px;color:#c9bfcf;white-space:nowrap}.nmrow input{flex:1;min-width:0;background:#1a1420;border:1px solid #4a3d52;border-radius:8px;color:#ece4d8;font-size:16px;padding:8px 10px}.nmrow button{background:#2e2535;border:1px solid #4a3d52;border-radius:8px;font-size:18px;padding:6px 10px}
.slotrow{display:flex;gap:6px;align-items:stretch}.slotrow .opt{flex:1;min-width:0}.sldel{background:#2e2535;border:1px solid #4a3d52;border-radius:10px;font-size:18px;padding:0 12px;margin:4px 0}
.rwd{background:#2a2230;border:1px solid #6b5a3a;border-radius:10px;padding:10px;margin:8px 0;text-align:center;color:#f0d9a8;font-size:15px}.rwd small{color:#c9bfcf;font-size:12px}.rwbar{height:6px;background:#1a1420;border-radius:3px;margin:8px 0 4px;overflow:hidden}.rwbar div{height:100%;background:#c98500;border-radius:3px}
/* village pages: shared parts (readable sizes, few words) */
#modal.sheet{align-items:flex-end;padding:10px 8px max(10px,env(safe-area-inset-bottom))}#modal.sheet .box{max-height:92vh}
.phead{margin:-6px 0 12px;padding:0 0 10px;text-align:center;border-bottom:1px solid #2f2733}
.pfoot{position:sticky;bottom:-16px;z-index:3;background:#211a25;margin:14px -16px -16px;padding:10px 12px 12px;border-top:1px solid #2f2733;display:flex;gap:8px;align-items:stretch}
.pfoot .pback{flex:1;justify-self:auto;min-height:50px;background:#2e2535;border:1px solid #5d4a69;border-radius:12px;color:#ece4d8;font-size:16px;padding:0 12px}
.pfoot .vgo{flex:2.2;margin:0}.pfoot .nav{flex:0 0 64px;min-height:50px;border-radius:12px;background:#2e2535;border:1px solid #5d4a69;color:#eee;font-size:22px}.pfoot .nav:disabled{opacity:.2}
.pfoot .gopri{flex:2.2;min-height:50px;border-radius:12px;background:linear-gradient(#3f321c,#2a2114);border:1px solid #c9a24a;color:#f6e6bf;font-size:17px;font-family:var(--mincho)}.pfoot .gopri small{display:block;font-family:inherit;font-size:13px;color:#cdb98e}
.phead h2{margin:0!important;font-family:var(--mincho);font-size:19px!important;white-space:nowrap}
.pback{white-space:nowrap}
.meter{display:flex;align-items:center;gap:10px;margin:0 2px 12px}.meter div{flex:1;height:8px;background:#2f2733;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:#e8b33a;border-radius:4px}.meter span{font-size:15px;color:#e6dccb;font-variant-numeric:tabular-nums;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px}
.tile{position:relative;background:#2a2230;border:1px solid #4a3d52;border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#ece4d8;min-width:0;min-height:58px}
.tile .ti{font-size:30px;line-height:1.1}.tile small{font-size:13px;color:#e0d6ca;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.tile em{font-style:normal;font-size:13px;color:#e8b33a}
.tile.big{padding:16px 2px 12px}.tile.big .ti{font-size:36px}
.tile.lock{opacity:.33;border-style:dashed;filter:grayscale(1)}
.tile.sel{border-color:#e8b33a;box-shadow:0 0 10px rgba(232,179,58,.3)}
.tile .badge{position:absolute;top:3px;right:5px;font-size:11px;line-height:1}
.tile:active{background:#3a2f42}
.pcard{background:#2a2230;border:1px solid #6b5a3a;border-radius:12px;padding:12px;margin:0 0 12px;display:flex;gap:12px;align-items:center;min-height:86px}
.pcard .ci{font-size:42px;line-height:1}.pcard.pc2{align-items:flex-start;padding:10px 12px}.pcard.pc2>div{width:100%}.pc2 b{display:flex!important;align-items:center;gap:8px}.pc2 .ci2{font-size:30px;line-height:1;font-family:initial}.pcard b{display:block;font-size:18px;font-family:var(--mincho);color:#f0d9a8}.pcard p{word-break:auto-phrase;font-size:14.5px!important;color:#e0d6ca!important;margin:4px 0 0!important;line-height:1.6!important}
.note{word-break:auto-phrase;text-wrap:balance;font-family:var(--mincho);font-size:17px;line-height:2.15;color:#e6dccb;text-align:center;padding:24px 4px;background:linear-gradient(#2c2431,#241d29);border:1px solid #4a3d52;border-radius:12px;letter-spacing:.01em}
.npager{text-align:center;margin-top:10px;font-size:15px;color:#c9bfcf;font-variant-numeric:tabular-nums}
.sw{display:grid;grid-template-columns:repeat(3,15px);gap:3px;margin:2px 0 2px}.sw i{width:15px;height:15px;border-radius:3px;display:block}
/* bottom bar & other pages */.tg.off{opacity:.45}.tg em{color:#8fe08f}.tg.off em{color:#f08a8a}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#2a2230;border:1px solid #4a3d52;border-radius:12px;padding:12px;margin:0 0 8px;color:#ece4d8;font-size:16px;min-height:52px}

.srow .ri{font-size:24px;width:30px;text-align:center}.srow .rt{flex:1;line-height:1.3}.srow .lk{display:block;background:none;border:0;padding:4px 0 0;color:#b9adc0;font-size:min(13px,3.7vw);white-space:nowrap;text-decoration:underline;text-align:left}
.seg{display:flex;background:#1b1520;border-radius:10px;padding:3px;gap:3px;flex:none}.seg button{min-width:44px;min-height:40px;border:0;border-radius:8px;background:transparent;color:#b9adc0;font-size:15px;font-weight:700}.seg button.on{background:#e8b33a;color:#211a25}
.newb{background:#e8b33a;color:#211a25;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.chg details{margin:0 0 6px}.chg summary{font-size:15px;color:#c9bfcf;padding:8px 0;cursor:pointer}.chg ul{font-size:14px!important;line-height:1.7!important}
.hlp{display:flex;flex-direction:column;gap:12px}.hcard{background:#2a2230;border:1px solid #4a3d52;border-radius:12px;padding:12px;text-align:center}
.hcard h4{margin:0 0 8px;font-size:15px;color:#f0d9a8;font-family:var(--mincho);font-weight:600}

(function(){if(!/[?&]rec(=|&|$)/.test(location.search))return;window.REC_MODE=true;
  const P='hiyori:',SP=Storage.prototype,g=SP.getItem,s=SP.setItem,r=SP.removeItem,k=(st,key)=>st===window.localStorage?P+key:key;
  window.REC_RAW={get:key=>g.call(localStorage,key),set:(key,v)=>s.call(localStorage,key,v),del:key=>r.call(localStorage,key)};
  SP.getItem=function(key){return g.call(this,k(this,key));};SP.setItem=function(key,v){return s.call(this,k(this,key),v);};SP.removeItem=function(key){return r.call(this,k(this,key));};
  try{if(localStorage.getItem('dchain_consent_v1')===null){localStorage.setItem('dchain_consent_v1','0');localStorage.setItem('dchain_share_v1','0');}
    if(!localStorage.getItem('dchain_name_v1'))localStorage.setItem('dchain_name_v1','ヒヨリ');}catch(e){}})();

function flushDeath(msgs,depth=0){if(!S||!S._dq||!S._dq.length)return;const q=S._dq;S._dq=[];let db=0,fz=false;

function applyDmg(e,d){if(e.armor>0){const a=Math.min(e.armor,d);e.armor-=a;d-=a;}e.hp-=d;}

/* ---------- board helpers ---------- */
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const adj=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]))===1;
const tileAt=p=>S.board[p[0]][p[1]];
function neighbors(r,c){const o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N)o.push([R,C]);}return o;}
function hasMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const g=groupOf(S.board[r][c].t);
    for(const a of neighbors(r,c)){if(groupOf(tileAt(a).t)!==g)continue;
      for(const b of neighbors(a[0],a[1])){if((b[0]!==r||b[1]!==c)&&groupOf(tileAt(b).t)===g)return true;}}}
  return false;
}
function rerollNonEnemies(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!isEnemy(S.board[r][c])){const t=randTile(S,true);t.ry=S.board[r][c].ry??r;S.board[r][c]=t;}}}
function ensureMove(){let i=0;while(!hasMove()&&i++<30)rerollNonEnemies();}
function removeAndFill(set){
  for(let c=0;c<N;c++){
    const keep=[];
    for(let r=N-1;r>=0;r--){if(!set.has(r*N+c)){const t=S.board[r][c];t.ry=(t.ry??r);keep.push(t);}}
    for(let i=0;i<keep.length;i++)S.board[N-1-i][c]=keep[i];
    const m=N-keep.length;
    for(let r=0;r<m;r++){const t=randTile(S,!!TUT);t.ry=r-m;S.board[r][c]=t;}
  }
}

const CB=[1,1,2,3,4];

function chainMult(n){const k=Math.max(0,n-3)+(S&&S.bless>0&&n>=3?3:0);return 1+.15*k+.012*k*k+(n>=4&&S&&S.anom==='wind'?.15:0);}

  return Math.max(1,Math.round((S.baseDmg+cells.filter(p=>tileAt(p).t==='sword').length*S.weaponDmg)*m*roll));}
const MIXK=.5;function mixMu(n){return MIXK;}/* 錬金術師：💰と🧪を混ぜてつなげる。混ぜると効果は半分（長さの倍率はそのまま） */

const HUNT=3;
function bonusTxtOf(n){const m=chainMult(n),b=chainBonus(n);return (m>1?`効果×${fmtM(m)}`:'')+(b?`・経験値+${b}`:'');}
function addGold(a){S.gold+=a;while(S.gold>=S.goldNeed){S.gold-=S.goldNeed;(S.prices||(S.prices=[])).push(S.goldNeed);S.goldNeed=Math.round(S.goldNeed*1.12+24*(S.cls==='thief'?2.2:1));S.pending.push('shop');}}
function commitChain(){
  const hp0=S.hp,full0=S.hp>=S.maxHp;
  const cells=chain.slice();chain=[];
  const first=tileAt(cells[0]);const g=groupOf(first.t);const types=cells.map(p=>tileAt(p).t);
  const remove=new Set();const msgs=[];const killsBefore=S.kills;const mixed=g==='mix'&&new Set(types).size>1;const bonus=mixed?Math.floor(chainBonus(cells.length)/2):chainBonus(cells.length);let mult=chainMult(cells.length);

    const eff=(g,n)=>{

    {label:'🛡️ 鎧を新調',desc:'最大防御+5、防御+5',apply:()=>{S.maxArmor+=5;S.armor+=5;}},
    {label:'❤️ 生命の護符',desc:'最大HP+25、HP+25',apply:()=>{S.maxHp+=25;S.hp+=25;}}];
  if(S.cls==='zombie')p.splice(1,1);

const POP_MS=1450;
function popLeft(){return Math.max(POP?Math.max(0,POP_MS-(performance.now()-POP.t0)):0,bannerLeft());}
function showNextPending(){
  if(modalOpen||!S||!S.pending.length)return;
  if(S.pending[0]==='clear'&&popLeft()<=0){showClear();return;}
  if(S.pending[0]==='event'&&popLeft()<=0){showEvent();return;}
  const left=popLeft();if(left>0){clearTimeout(pendTimer);pendTimer=setTimeout(showNextPending,left+120);return;}
  const kind=S.pending[0];
  const head={level:['🎉 レベルアップ！',TUT?`Lv${S.level}になった。1つ選んでください。`:`${NM()}はLv${S.level}になった。1つ選んでください。`],

    shield:['🛡️ 防具の強化','盾ポイントがたまった。1つ選んでください。']}[kind];
  sfx(kind==='level'?'level':'shop');
  const opts=kind==='level'?levelOptions():kind==='shop'?shopOptions():shieldOptions();
  if(!opts.length){S.pending.shift();showNextPending();return;}
  const optsHtml=opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}<small>${o.desc}</small></button>`).join('');

  else if(kind==='shop'){const pr=S.prices&&S.prices.length?S.prices.shift():0;openModal(shopHead(SHOP_HI[rnd(SHOP_HI.length)],pr)+optsHtml,'m-shop');}
  else if(kind==='shield')openModal(`<div class="smithhd"><span>🛡️</span><span class="hm">🔨</span></div>`+optsHtml,'m-smith');
  else openModal(`<h2>${head[0]}</h2><p style="text-align:center">${head[1]}</p>`+optsHtml);
  $('mbox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S._picking)return;const o=opts[+b.dataset.i];if(o.replaceId){chooseReplace(o.replaceId,kind,opts);return;}

function upCount(o){if(!S||!S.run||!o)return;const u=S.run.up||(S.run.up={});const k=String(o.label).replace(/（.*?）/g,'').replace(/^\S+\s/,'').replace(/新スキル「(.*)」/,'$1').trim().slice(0,12);u[k]=(u[k]||0)+1;}

/* 選んだ瞬間の演出：レベルは光って昇る／ショップはコインが飛んで「毎度あり」 */
function gotAnim(b,kind){b.classList.add('got');
  if(kind==='shop'){sfx('shop');const bub=$('mbox').querySelector('.bub');if(bub)bub.textContent='毎度あり！';
    const src=($('mbox').querySelector('.ptag')||bub||b).getBoundingClientRect(),dst=b.getBoundingClientRect();
    for(let i=0;i<6;i++){const c=document.createElement('span');c.className='coinfly';c.textContent='🪙';c.style.left=(src.left+src.width/2-10)+'px';c.style.top=(src.top+src.height/2-10)+'px';document.body.appendChild(c);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transitionDelay=(i*35)+'ms';c.style.transform=`translate(${dst.left+dst.width*(.3+.08*i)-src.left-src.width/2}px,${dst.top+dst.height/2-src.top-src.height/2}px) scale(.7)`;c.style.opacity='0.2';}));
      setTimeout(()=>c.remove(),700);}}
  else if(kind==='shield'){sfx('guard');const r=b.getBoundingClientRect();
    for(let i=0;i<14;i++){const c=document.createElement('span');c.className='spark';c.style.left=(r.left+r.width/2)+'px';c.style.top=(r.top+r.height/2)+'px';document.body.appendChild(c);
      const an=Math.random()*Math.PI*2,d=40+Math.random()*90;requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${Math.cos(an)*d}px,${Math.sin(an)*d-20}px)`;c.style.opacity='0';}));setTimeout(()=>c.remove(),600);}}
  else sfx('level');vib(30);}

function serialize(){return JSON.stringify(S,(k,v)=>(k==='ry'||k==='hit')?undefined:v);}
function saveGame(){
  if(!S||!inGame||TUT)return;S.ts=Date.now();
  const json=serialize();savedJson=json;
  try{localStorage.setItem(slotKey(SLOT),json);}catch(e){}
  cloudWrite('save',{json,ts:S.ts});
}
function deleteSave(){savedJson=null;try{localStorage.removeItem(slotKey(SLOT));}catch(e){}cloudWrite('save','DEL');}
function recordBest(){
  const prev=best||{turn:-1,kills:0,level:0,chain:0};
  const pf=prev.floor||(prev.turn>=0?1+Math.floor(prev.turn/2):0),F=floorOf();
  const isNew=F>pf||(F===pf&&S.turn>prev.turn),chain=Math.max(prev.chain||0,S.maxChain||0),cleared=Math.max(prev.cleared||0,S.cleared||0);
  const nb=isNew?{turn:S.turn,kills:S.kills,level:S.level,floor:F,chain,cleared}:{...prev,chain,cleared};
  if(isNew||chain!==(prev.chain||0)||cleared!==(prev.cleared||0)){best=nb;try{localStorage.setItem(LS_BEST,JSON.stringify(best));}catch(e){}cloudWrite('best',best);}
  return isNew;
}
function startFromSave(json){
  const s=JSON.parse(json);if(!s.floor)s.floor=1+Math.floor(s.turn/2);if(!s.run)s.run={hit:true,shops:99,mute:0};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)s.board[r][c].ry=r;
  S=s;startGame();
}

/* cloud (claude.ai artifact db) */
const cq={};
const cref=name=>DB.doc('data/users/'+UID+'/'+name);
function cloudWrite(name,data){if(!cloudOn)return;const q=cq[name]||(cq[name]={busy:false,next:null});q.next=data;if(!q.busy)pump(name);}
async function pump(name){
  const q=cq[name];q.busy=true;
  while(q.next!==null&&cloudOn){const d=q.next;q.next=null;
    const run=()=>d==='DEL'?cref(name).delete():cref(name).set(d);
    try{await run();}catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await run();}catch(e2){}}
      else{cloudOn=false;setCloud('端末内にのみ保存中');}}
  }
  q.busy=false;
}
function setCloud(t){$('cloud').textContent='セーブ: '+t;}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setCloud('この端末のブラウザに保存');return;}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setCloud('この端末のブラウザに保存');return;}
    const id=await user.id();if(!id){setCloud('この端末のブラウザに保存');return;}
    DB=db;UID=id;
    const timer=setTimeout(()=>setCloud('クラウドに接続できません（端末に保存中）'),10000);
    const [sv,bs,ac]=await Promise.all([cref('save').get(),cref('best').get(),cref('ach').get()]);
    clearTimeout(timer);cloudOn=true;setCloud('クラウドに自動保存（他の端末でも続きから遊べます）');
    // merge save
    let localTs=0;try{localTs=savedJson?JSON.parse(savedJson).ts||0:0;}catch(e){}
    if(sv.exists){const d=sv.data();
      if(d&&typeof d.json==='string'&&(d.ts||0)>localTs&&!inGame){savedJson=d.json;try{localStorage.setItem(LS_SAVE,d.json);}catch(e){}}
      else if(savedJson&&localTs>(d.ts||0))cloudWrite('save',{json:savedJson,ts:localTs});}
    else if(savedJson)cloudWrite('save',{json:savedJson,ts:localTs});
    if(bs.exists){const b=bs.data();if(b&&(!best||b.turn>best.turn)){best={turn:b.turn,kills:b.kills,level:b.level,chain:Math.max(b.chain||0,best&&best.chain||0)};try{localStorage.setItem(LS_BEST,JSON.stringify(best));}catch(e){}}
      else if(best&&b&&best.turn>b.turn)cloudWrite('best',best);}
    else if(best)cloudWrite('best',best);
    try{if(ac.exists){const d=ac.data();if(d&&typeof d.json==='string'&&achMerge(JSON.parse(d.json))){try{localStorage.setItem(LS_ACH,JSON.stringify(ACH));}catch(e){}}cloudWrite('ach',{json:JSON.stringify(ACH)});}else if(achCount())cloudWrite('ach',{json:JSON.stringify(ACH)});}catch(e){}
    refreshTitle();
  }catch(e){setCloud('この端末のブラウザに保存');}
}

let tAnimOn=false;const TT=['skull','sword','shield','potion','coin'];
function tRand(){return TT[rnd(TT.length)];}
function titleAnim(){if(tAnimOn)return;tAnimOn=true;const bd=$('tBoard'),sv=$('tTrace');if(!bd)return;
  const RW=8,g=[];bd.innerHTML='';for(let r=0;r<RW;r++){g.push([]);for(let c=0;c<N;c++){const i=document.createElement('i');bd.appendChild(i);g[r].push(null);}}
  const cells=[...bd.children];const set=(r,c,t)=>{g[r][c]=t;const el=cells[r*N+c];el.textContent=ICON[t];el.style.background=BG[t];};
  for(let r=0;r<RW;r++)for(let c=0;c<N;c++)set(r,c,tRand());
  const grp=t=>t==='sword'||t==='skull'?'a':t;
  function findChain(){let best=null;for(let k=0;k<40;k++){const r0=rnd(RW),c0=rnd(N),G=grp(g[r0][c0]),P=[[r0,c0]];
      for(let st=0;st<9;st++){const [r,c]=P[P.length-1],nb=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if((dr||dc)&&rr>=0&&cc>=0&&rr<RW&&cc<N&&grp(g[rr][cc])===G&&!P.some(q=>q[0]===rr&&q[1]===cc))nb.push([rr,cc]);}
        if(!nb.length)break;P.push(nb[rnd(nb.length)]);}
      if(!best||P.length>best.length)best=P;if(best.length>=6)break;}
    if(best.length<3){for(let r=0;r<RW;r++)for(let c=0;c<N;c++)set(r,c,tRand());return findChain();}return best;}
  function cycle(){if($('title').classList.contains('hidden')){tAnimOn=false;return;}
    const P=findChain(),W=bd.clientWidth,H=bd.clientHeight,cw=(W-10)/N,ch=(H-10)/RW;sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const pts=P.map(([r,c])=>`${5+c*cw+cw/2},${5+r*ch+ch/2}`);let i=0;
    sv.innerHTML=`<polyline fill="none" stroke="rgba(255,255,255,.75)" stroke-width="${Math.max(3,cw*.1)}" stroke-linecap="round" stroke-linejoin="round" points=""/>`;const pl=sv.firstChild;
    const t=setInterval(()=>{if(i<P.length){cells[P[i][0]*N+P[i][1]].classList.add('on');i++;pl.setAttribute('points',pts.slice(0,i).join(' '));return;}
      clearInterval(t);setTimeout(()=>{P.forEach(([r,c])=>{const el=cells[r*N+c];el.classList.remove('on');el.classList.add('gone');});sv.innerHTML='';
        setTimeout(()=>{P.forEach(([r,c])=>{set(r,c,tRand());cells[r*N+c].classList.remove('gone');});setTimeout(cycle,700);},380);},650);},230);}
  setTimeout(cycle,900);}

function embers(r,c){const cs=cv.width/N;for(let k=0;k<5;k++)PARTS.push({x:c*cs+cs*(.3+.4*Math.random()),y:r*cs+cs*.6,vx:(Math.random()-.5)*cs*.6,vy:-cs*(1.2+Math.random()),life:0,max:.45+Math.random()*.2,c:Math.random()<.5?'#ff8a3a':'#ffd06a',s:cs*.035});}
function shards(r,c){const cs=cv.width/N;for(let k=0;k<7;k++){const a=Math.random()*Math.PI*2;PARTS.push({x:c*cs+cs*.75,y:r*cs+cs*.25,vx:Math.cos(a)*cs*1.6,vy:Math.sin(a)*cs*1.6-cs*.8,life:0,max:.4,c:'#9fb4d8',s:cs*.03});}}
const PCOL={coin:'#ffd54a',sword:'#d6defa',skull:'#ff6b6b',shield:'#6fb6ff',potion:'#e07bff'};
let PARTS=[],POP=null,FLASH=0,liveTier=-1;
const tierOf=n=>{let t=-1;TIERS.forEach((x,i)=>{if(n>=x[0])t=i;});return t;};
function celebrate(cells,types,kills,bonusTxt){
  const n=cells.length,tier=tierOf(n),bt=bonusTier(n),W=cv.width,cs=W/N;
  const per=Math.min(4+Math.max(0,bt+1)*2,Math.max(3,Math.floor(200/n))),sp=(1+Math.max(0,bt)*.25)*cs;
  cells.forEach((p,i)=>{for(let k=0;k<per;k++){const a=Math.random()*Math.PI*2,v=(.4+Math.random())*sp*2.2;
    PARTS.push({x:p[1]*cs+cs/2,y:p[0]*cs+cs/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cs*1.5,life:0,max:.55+Math.random()*.5,c:PCOL[types[i]],s:cs*(.05+Math.random()*.06)});}});
  if(PARTS.length>900)PARTS.splice(0,PARTS.length-900);
  const prevBest=Math.max(best&&best.chain||0,S.maxChain||0);
  S.maxChain=Math.max(S.maxChain||0,n);
  let text=null,color='#fff',sub='';
  if(tier>=0){text=TIERS[tier][1];color=TIERS[tier][2];sub=`${n}チェーン`;}
  if(kills>=3&&text)sub+=` ／ ${kills}体撃破`;else if(kills>=5){text=`${kills}体まとめて撃破！`;color='#ff8a7a';}
  if(n>=10&&n>prevBest)sub+=(sub?'　':'')+'🏆 自己ベスト！';
  if(text){POP={text,sub,sub2:bonusTxt||'',color,t0:performance.now(),tier:Math.max(0,tier)};sfx('praise',Math.max(0,tier));
    if(tier>=2)FLASH=performance.now();
    vib(tier>=3?[30,40,60]:tier>=1?[25,30,25]:20);}
  else if(bonusTxt){const p=cells[cells.length-1];FLOATS.push({text:bonusTxt,x:p[1]*cs+cs/2,y:p[0]*cs+cs/2,t0:performance.now()});}
}
function rainbow(now,o=0){return `hsl(${(now/4+o)%360},95%,65%)`;}
function drawFx(now,dt,cs){
  const W=cv.width;
  // live chain counter next to the finger
  if(dragging&&chain.length>=3){
    const n=chain.length,t=bonusTier(n);
    if(t>liveTier&&t>=0){liveTier=t;sfx('tierUp',t);}
    const last=chain[n-1];let x=last[1]*cs+cs*.92,y=last[0]*cs+cs*.08;
    x=Math.min(W-cs*.35,Math.max(cs*.35,x));y=Math.max(cs*.3,y);
    const col=t<0?'#ffffff':TIERS[t][2]==='rainbow'?rainbow(now):TIERS[t][2];
    const f=cs*(.34+Math.max(0,t)*.04);
    ctx.save();ctx.font=`900 ${f}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=f*.22;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(`×${n}`,x,y);ctx.fillStyle=col;ctx.fillText(`×${n}`,x,y);ctx.restore();
  }else liveTier=-1;
  // particles
  for(const p of PARTS){p.life+=dt;p.vy+=cs*9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  PARTS=PARTS.filter(p=>p.life<p.max);
  for(const p of PARTS){ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  // flash
  if(FLASH){const e=(now-FLASH)/1000;if(e<.25){ctx.fillStyle=`rgba(255,255,255,${.35*(1-e/.25)})`;ctx.fillRect(0,0,W,W);}else FLASH=0;}
  FLOATS=FLOATS.filter(f=>now-f.t0<(f.dur||1100));
  for(const f of FLOATS){const e=(now-f.t0)/(f.dur||1100);let fs=cs*(f.sz||.28);ctx.save();ctx.globalAlpha=e>.7?1-(e-.7)/.3:1;ctx.font=`800 ${fs}px system-ui,sans-serif`;
    const w=ctx.measureText(f.text).width;const x=Math.min(W-w/2-4,Math.max(w/2+4,f.x)),y=Math.max(fs,f.y-e*cs*.9);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=fs*.25;ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.col||'#ffe08a';ctx.fillText(f.text,x,y);ctx.restore();}
  /* 狙い撃ち：照準がキュッと縮んで当たる */
  RETS=RETS.filter(r=>now-r.t0<350);for(const r of RETS){const e=(now-r.t0)/350,x=r.p[1]*cs+cs/2,y=r.p[0]*cs+cs/2,R=cs*(.7-.4*e);ctx.save();ctx.globalAlpha=1-e*.6;ctx.strokeStyle='#ff5a5a';ctx.lineWidth=cs*.05;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();ctx.beginPath();[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{ctx.moveTo(x+dx*R*.5,y+dy*R*.5);ctx.lineTo(x+dx*R*1.2,y+dy*R*1.2);});ctx.stroke();ctx.restore();}
  // praise text
  if(POP){const e=(now-POP.t0)/1000;if(e>1.45)POP=null;else{
    const s=e<.16?.3+e/.16*.95:e<.28?1.25-(e-.16)/.12*.25:1,al=e>1.1?Math.max(0,1-(e-1.1)/.35):1;
    ctx.save();ctx.globalAlpha=al;ctx.translate(W/2,W*.42-e*cs*.25);ctx.scale(s,s);
    if(POP.tier>=3)ctx.rotate(Math.sin(now/60)*.03);
    let f=cs*(.55+POP.tier*.06);ctx.font=`900 ${f}px system-ui,sans-serif`;
    const w=ctx.measureText(POP.text).width;if(w>W*.92){f*=W*.92/w;ctx.font=`900 ${f}px system-ui,sans-serif`;}
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.lineWidth=f*.22;ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(POP.text,0,0);
    if(POP.color==='rainbow'){const g=ctx.createLinearGradient(-W/2,0,W/2,0);for(let i=0;i<=6;i++)g.addColorStop(i/6,rainbow(now,i*60));ctx.fillStyle=g;}else ctx.fillStyle=POP.color;
    ctx.fillText(POP.text,0,0);
    const line=(txt,yy,col)=>{let f2=cs*.26;ctx.font=`800 ${f2}px system-ui,sans-serif`;const w2=ctx.measureText(txt).width;if(w2>W*.94){f2*=W*.94/w2;ctx.font=`800 ${f2}px system-ui,sans-serif`;}
      ctx.lineWidth=f2*.25;ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(txt,0,yy);ctx.fillStyle=col;ctx.fillText(txt,0,yy);};
    if(POP.sub)line(POP.sub,f*.85,'#fff');
    if(POP.sub2)line(POP.sub2,f*.85+cs*.34,'#ffe08a');
    ctx.restore();}}
}

const SKCOL={fire:'#ff8a3a',thunder:'#ffe94a',snipe:'#ff5a5a',freeze:'#9fe0ff',crush:'#d0d0d0',magnet:'#ffd54a',execute:'#c58bff',heal:'#7fe08a',wall:'#6fb6ff',alchemy:'#ffd54a',arm:'#d6defa',quake:'#b48cff',bless:'#ffe08a'};
let BOLTS=[],RINGS=[];
function burst(cells,col,mult){
  const cs=cv.width/N;
  cells.forEach(p=>{for(let k=0;k<Math.round(10*mult);k++){const a=Math.random()*Math.PI*2,v=(.4+Math.random())*cs*2.4*mult;
    PARTS.push({x:p[1]*cs+cs/2,y:p[0]*cs+cs/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cs*1.4,life:0,max:.5+Math.random()*.5,c:col,s:cs*(.05+Math.random()*.06)});}});
  if(PARTS.length>900)PARTS.splice(0,PARTS.length-900);
}
function skillFx(id,cells,kills){
  const d=SKILLS[id],col=SKCOL[id]||'#fff',now=performance.now();
  let pts=cells;
  if(!pts.length){pts=[];for(let i=0;i<8;i++)pts.push([rnd(N),rnd(N)]);}
  burst(pts,col,kills?1.5:1);
  if(id==='thunder')cells.forEach((p,i)=>BOLTS.push({p,t0:now+i*90}));
  if(id==='snipe'||id==='execute'||id==='freeze'||id==='crush')cells.forEach(p=>RINGS.push({p,t0:now,col}));
  if(id==='fire'||kills>=3||id==='thunder')FLASH=now;
  let sub=kills>=3?`${kills}体まとめて撃破！`:kills?`${kills}体撃破`:'';
  POP={text:`${d.icon} ${d.name}！`,sub,sub2:'',color:col,t0:now,tier:kills>=3?2:kills?1:0};
  if(kills){sfx('kill',kills);if(kills>=3)sfx('praise',2);}
  vib(kills?[25,30,25]:15);
}
function drawSkillFx(now,cs){
  const W=cv.width;
  BOLTS=BOLTS.filter(b=>now-b.t0<320);
  for(const b of BOLTS){const e=now-b.t0;if(e<0)continue;const al=1-e/320,x=b.p[1]*cs+cs/2,y=b.p[0]*cs+cs/2;
    ctx.save();ctx.strokeStyle=`rgba(255,240,120,${al})`;ctx.shadowColor='#fff6a0';ctx.shadowBlur=cs*.4;ctx.lineWidth=cs*.08;ctx.lineJoin='round';
    ctx.beginPath();let px=x+(Math.random()-.5)*cs,py=-cs*.2;ctx.moveTo(px,py);const seg=6;
    for(let i=1;i<=seg;i++){const ty=py+(y-py)*i/seg,tx=i===seg?x:x+(Math.random()-.5)*cs*.9*(1-i/seg)+(px-x)*(1-i/seg);ctx.lineTo(tx,ty);}
    ctx.stroke();ctx.restore();}
  RINGS=RINGS.filter(r=>now-r.t0<500);
  for(const r of RINGS){const e=Math.max(0,(now-r.t0)/500),x=r.p[1]*cs+cs/2,y=r.p[0]*cs+cs/2;
    ctx.save();ctx.globalAlpha=1-e;ctx.strokeStyle=r.col;ctx.lineWidth=cs*.06;ctx.beginPath();ctx.arc(x,y,cs*(.15+.45*e),0,Math.PI*2);ctx.stroke();ctx.restore();}
}

function achMerge(o){
  if(!o||!o.u)return false;const before=JSON.stringify(ACH),ra=ACH.resetAt||0,ro=o.resetAt||0,R=Math.max(ra,ro),u={};
  for(const src of [ACH.u,o.u])for(const k in src)if(src[k]>=R&&(!u[k]||src[k]<u[k]))u[k]=src[k];
  let st;if(ra===ro){st={...ACH.st};for(const k in(o.st||{}))st[k]=Math.max(st[k]||0,o.st[k]||0);}else st=ra>ro?{...ACH.st}:{...(o.st||{})};
  ACH={v:1,u,st,...(R?{resetAt:R}:{})};return JSON.stringify(ACH)!==before;
}

function achState(){
  if(TUT||!S)return;checkUnlocks();const F=floorOf();
  [[2,'f2'],[10,'f10'],[20,'f20'],[40,'f40'],[60,'f60'],[80,'f80'],[100,'f100'],[150,'f150'],[200,'f200']].forEach(([f,id])=>{if(F>=f)unlock(id);});
  if(S.level>=10)unlock('lv10');if(S.level>=20)unlock('lv20');
  if(S.skills.length>=4)unlock('sk4');if(S.weaponDmg>=10)unlock('wpn10');if(S.maxHp>=200)unlock('hp200');
  if((ACH.st.kills||0)>=100)unlock('k100');if((ACH.st.kills||0)>=1000)unlock('k1000');
  if((ACH.st.skills||0)>=50)unlock('skill50');if((ACH.st.games||0)>=10)unlock('games10');

  const R=S.run;if(R){if(F>=10&&!R.hit)unlock('s_nodmg');if(F>=40&&!R.shops)unlock('s_noshop');}
}
function achLong(){

  ge('kills',3000,'k3000');ge('kills',10000,'k10000');ge('kills',30000,'k30000');ge('skills',200,'skill200');ge('skills',500,'skill500');
  ge('bosses',50,'boss50');ge('bosses',200,'boss200');ge('clears',3,'clears3');ge('clears',10,'clears10');ge('c15',50,'s_c15x50');

  if(st.bosses===undefined)st.bosses=['ogre','dragon','vampire','kraken','abyss'].reduce((a,k)=>a+(UNL.kills[k]||0),0);

  if(st.days===undefined){const ds=new Set(RUNS.map(r=>new Date(r.d).toDateString()));st.days=ds.size;st.lastDay=[...ds].pop()||'';}

function achChain(n,g,killed,hp0,full0){
  if(TUT)return;achKills(killed);
  if(n>=15)achStat('c15');if(n>=10)unlock('c10');if(n>=14)unlock('c14');if(n>=20)unlock('c20');if(killed.length>=5)unlock('mk5');
  if(g==='coin'&&n>=12)unlock('coin12');if(g==='shield'&&n>=10)unlock('shield10');if(g==='potion'&&n>=10)unlock('potion10');

function achAfterTurn(hp0,boomed){
  if(TUT||!S)return;const R=S.run||(S.run={hit:true,shops:99,mute:0});
  if(S.hp<hp0&&floorOf()<10)R.hit=true;
  if(S.hp===1)unlock('s_1hp');
  if(boomed&&hp0-S.hp>=S.maxHp/2)unlock('s_boom');
  if(!S.board.flat().some(isEnemy))unlock('s_silence');
  if(!AU.on.bgm&&!AU.on.sfx&&!AU.on.vib){R.mute=(R.mute||0)+1;if(R.mute>=10)unlock('s_mute');}
  achState();
}

/* ---------- copy helper ---------- */
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand('copy');ta.remove();if(ok)return true;}catch(e){}
  return false;
}

const LS_VER='dchain_seen_ver';
/* 同じ日の更新は1つにまとめて見せる（新しい順） */
function chgByDay(){const out=[];for(const c of CHANGELOG){let g=out.find(x=>x.d===c.d);if(!g){g={d:c.d,vs:[],items:[]};out.push(g);}g.vs.push(c.v);g.items.push(...c.items);}return out;}
function verUnseen(){let v=null;try{v=localStorage.getItem(LS_VER);}catch(e){}
  if(v===VERSION)return false;if(!v&&!((ACH&&ACH.st&&ACH.st.games)||0)){try{localStorage.setItem(LS_VER,VERSION);}catch(e){}return false;}return true;}
function refreshVer(){const b=$('ver');if(!b)return;const n=verUnseen();b.textContent=`v${VERSION}`+(n?' ・ 更新内容を見る':'');b.classList.toggle('new',n);}
function showChangelog(back){try{localStorage.setItem(LS_VER,VERSION);}catch(e){}refreshVer();
  const top=CHANGELOG[0],D=chgByDay().map(g=>({...g,items:g.items.filter(x=>!top.items.includes(x))})).filter(g=>g.items.length),day=g=>`<ul>${g.items.map(x=>`<li>${x}</li>`).join('')}</ul>`,dt=g=>g.d.slice(5).replace('-','/');
  openModal(`${pgHead('📋 更新内容','設定','chgB')}<p style="text-align:center;margin:0 0 6px"><span class="chip">v${VERSION}</span></p><div class="chg">
    <h3>✨ ${dt(top)}</h3>${day(top)}${D.map(g=>`<details><summary>${dt(g)}</summary>${day(g)}</details>`).join('')}</div>`);
  $('chgB').onclick=()=>{if(back)back();else closeModal();};}
function showSettings(back,msg){
  if(back!==undefined)settingsBack=back;
  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map((t,i)=>`<button data-v="${i}" class="${cur===i?'on':''}">${t}</button>`).join('')}</div>`;
  /* 並びはKROPKI・LAPISと同じ: 音 → このゲームの設定 → 記録の送信 → 更新内容 → ホーム画面に追加 → 消去 */
  openModal(`${pgHead('⚙️ 設定','戻る','stClose')}
    <div class="srow"><span class="ri">🎵</span><span class="rt">BGM</span>${seg('stB',BGM_LB,bgmLv())}</div>
    <div class="srow"><span class="ri">🔊</span><span class="rt">効果音</span>${seg('stS',['ON','OFF'],AU.on.sfx?0:1)}</div>
    <div class="srow"><span class="ri">${VIB_IC==='振動'?'📳':VIB_IC}</span><span class="rt">振動</span>${seg('stV',['ON','OFF'],AU.on.vib?0:1)}</div>
    <button class="prow" id="stStory" style="margin-top:14px"><span class="ri">📜</span><span class="rt">物語をもう一度</span><span class="rs">›</span></button>
    <div class="srow" style="margin-top:14px"><span class="ri">📤</span><span class="rt">プレイ記録を送る<button class="lk" id="stCs">送信内容について ›</button></span>${seg('stR',['ON','OFF'],shareOn()?0:1)}</div>
    <button class="prow" id="stVer"><span class="ri">📋</span><span class="rt">更新内容${verUnseen()?'<span class="newb">NEW</span>':''}</span><span class="rs">v${VERSION} ›</span></button>
    ${isApp()?'':'<button class="prow" id="stA2h"><span class="ri">📲</span><span class="rt">ホーム画面に追加<br><small style="color:#b9adc0;font-size:12.5px">全画面ですぐ遊べる</small></span><span class="rs">›</span></button>'}
    ${inGame?'':'<button class="prow" id="stData" style="margin-top:14px"><span class="ri">🗑️</span><span class="rt">記録のリセット</span><span class="rs">›</span></button><button class="prow danger" id="stWipe"><span class="ri">⚠️</span><span class="rt">すべて初期化</span><span class="rs">›</span></button>'}
    ${msg?`<p id="stMsg" style="text-align:center;color:#8fe08f;font-size:14.5px">${msg}</p>`:''}`);
  const segOn=(id,fn)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{fn(+b.dataset.v);showSettings();});
  segOn('stB',n=>{AU.on.bgm=n>0;if(n)AU.on.bv=n;saveAudio();setBgmVol();refreshAudioBtns();if(AU.on.bgm&&inGame)bgmStart();if(!AU.on.bgm)bgmStop();});
  segOn('stS',n=>{AU.on.sfx=n===0;saveAudio();refreshAudioBtns();});
  segOn('stV',n=>{AU.on.vib=n===0;saveAudio();refreshAudioBtns();if(AU.on.vib)vib(30);});
  document.querySelectorAll('#stR button').forEach(b=>b.onclick=()=>{
    const want=b.dataset.v==='0';if(want===shareOn())return;
    if(want&&consentVal()!=='1'){openConsent(()=>showSettings());return;}
    try{const nv=want?'1':'0';localStorage.setItem(LS_SHARE,nv);localStorage.setItem('tkcy3_share',nv);}catch(e){}showSettings();});
  $('stCs').onclick=()=>openConsent(()=>showSettings());
  $('stVer').onclick=()=>showChangelog(()=>showSettings());
  $('stStory').onclick=()=>{closeModal();playStory(()=>{if(inGame)return;bgmStop();showSettings();});};
  if($('stA2h'))$('stA2h').onclick=()=>showAddHome(()=>showSettings());

  $('stClose').onclick=()=>{const b=settingsBack;settingsBack=null;if(b)b();else closeModal();};
}
/* 記録のリセット：消すものを選ぶ（説明は確認画面で出す）。すべて消すのは設定の「すべて初期化」から */
function showDataReset(){
  const row=(id,ic,t,dis)=>`<button class="prow ${id==='rs6'?'danger':''}" id="${id}" ${dis?'disabled style="opacity:.35"':''}><span class="ri">${ic}</span><span class="rt">${t}</span></button>`;
  openModal(`${pgHead('🗑️ 記録のリセット','設定','rsB')}${row('rs1','🏆','実績')}${row('rs2','🥇','最高記録と戦績',!best)}${row('rs3','💾','セーブデータ',!anySave())}${row('rs5','🎓','はじめての状態に')}`);
  $('rsB').onclick=()=>showSettings();
  $('rs1').onclick=()=>confirmReset('実績をリセット','解除した実績と、累計撃破数・スキル使用回数などの記録がすべて未解除に戻ります。',resetAch);
  if(best)$('rs2').onclick=()=>confirmReset('最高記録と戦績をリセット','最深記録・最長チェーン・元凶討伐の記録と、戦績の冒険履歴が消えます。',resetBest);
  if(anySave())$('rs3').onclick=()=>confirmReset('セーブデータを削除','「続きから」で遊べる冒険（3スロットすべて）が消えます。',resetSaveData);
  $('rs5').onclick=()=>confirmReset('はじめての状態に戻す','チュートリアルを終えた記録が消え、次の「はじめから」で初めての人向けの案内が出ます。',resetTutFlag);
}
function confirmReset(name,detail,fn,twice,back){
  back=back||showDataReset;
  const done=()=>{fn();refreshTitle();sfx('block');showSettings(undefined,`✓ ${name}：完了しました`);};
  openModal(`<h2>${name}</h2><p style="text-align:center">${detail}<br><b style="color:#f5a0a0">この操作は取り消せません。</b>${cloudOn?'<br><small>クラウドに保存された分も消えます。</small>':''}</p>
    <button class="opt" id="cfN" style="text-align:center">やめる</button><button class="opt" id="cfY" style="text-align:center;border-color:#8a3a3a;color:#ffc4c4">リセットする</button>`);
  $('cfN').onclick=back;
  $('cfY').onclick=()=>{if(!twice){done();return;}
    openModal(`<h2>⚠️ 最終確認</h2><p style="text-align:center">本当に、すべてのデータを消して<br>初期状態に戻しますか？</p>
      <button class="opt" id="cfN2" style="text-align:center">やめる</button><button class="opt" id="cfY2" style="text-align:center;border-color:#8a3a3a;color:#ffc4c4">すべて消す</button>`);
    $('cfY2').onclick=done;$('cfN2').onclick=back;};
}

function chartRows(rows,unit,valW=96){

  const W=320,rh=30,L=118,iw=W-L-valW,max=Math.max(1,...rows.map(r=>r.v));
  let s='';rows.forEach((r,i)=>{const yy=i*rh+4,w=r.v/max*iw;
    s+=`<text x="${L-6}" y="${yy+17}" text-anchor="end" class="vz-lb">${esc(r.label)}</text>`+
      (r.v>0?`<path d="${hbarPath(L,yy+5,Math.max(2,w),rh-12,3)}" fill="${r.col||VC.c1}"/>`:'')+
      `<text x="${L+Math.max(2,w)+6}" y="${yy+17}" class="vz-val">${esc(r.txt!==undefined?r.txt:r.v+unit)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${rows.length*rh+6}" class="vz-svg">${s}</svg>`;
}

const LP_MS=420;
function showTip(html,x,y){
  const t=$('tip');t.innerHTML=html;t.classList.remove('hidden');
  const w=t.offsetWidth,h=t.offsetHeight,W=innerWidth,H=innerHeight;
  let L=Math.max(8,Math.min(W-w-8,x-w/2)),T=y-h-28;if(T<8)T=Math.min(H-h-8,y+28);
  t.style.left=L+'px';t.style.top=T+'px';
  vib(15);
}
function hideTip(){$('tip').classList.add('hidden');}
function attachLP(el,html,onTap){
  let tm=null,shown=false,sx=0,sy=0,down=false;
  let moved=false;
  el.addEventListener('pointerdown',e=>{down=true;shown=false;moved=false;sx=e.clientX;sy=e.clientY;clearTimeout(tm);try{el.setPointerCapture(e.pointerId);}catch(_){}
    tm=setTimeout(()=>{if(!down)return;shown=true;showTip(html(),sx,sy);},LP_MS);});
  el.addEventListener('pointermove',e=>{if(down&&!shown&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=true;clearTimeout(tm);}});
  el.addEventListener('pointerup',()=>{const was=down;down=false;clearTimeout(tm);if(shown){hideTip();shown=false;}else if(was&&!moved&&onTap)onTap();});
  el.addEventListener('pointercancel',()=>{down=false;clearTimeout(tm);if(shown){hideTip();shown=false;}});
}
const tipHead=(ic,name)=>`<div class="th">${ic} ${name}</div>`;
function tileInfo(p){
  const t=tileAt(p);
  switch(t.t){
    case 'sword':return tipHead('⚔️','剣')+`💀（敵）と一緒につなげます。<br>つないだ敵<b>全員</b>に「基礎${S.baseDmg}＋剣の本数×${S.weaponDmg}」のダメージ。<br>例：剣2本なら<b>${S.baseDmg+2*S.weaponDmg}</b>ダメージ<br>長くつなぐほど 倍率アップ（4つ×1.2／7つ×1.8／10つ×2.6）`;
    case 'shield':return tipHead('🛡️','盾')+`1枚につき防御+${S.armorPer}（最大${S.maxArmor}）。<br>防御は敵の攻撃を先に受け止めます。<br>あふれた分は盾ポイント（${S.shieldPts}/${S.shieldNeed}）になり、たまると防具を強化できます。`;
    case 'potion':return tipHead('🧪','回復薬')+`1個につきHP+${S.healPer}（最大HP${S.maxHp}まで）。<br>回復しきれなかった分は 半分が💰になります。`;
    case 'coin':return tipHead('💰','お金')+`1枚につき+${S.goldPer}。<br>${S.goldNeed}たまるとショップで強化を1つ選べます（今${S.gold}）。`;
    case 'skull':{
      const k=kindOf(t),d=EK[k];let st='';
      if(t.fresh)st+='出てきたばかり（次のターンから行動）<br>';
      if(t.frz>0)st+=`❄ 凍結中（あと${t.frz}ターン動けない）<br>`;
      if(k==='golem')st+=t.rest?'💤 次のターンは休み<br>':'次のターンは攻撃してくる<br>';
      if(k==='dragon')st+=`🔥 ブレスまで あと${3-(t.ch||0)}ターン（${t.atk*3}ダメージ）<br>`;
      if(k==='bomb')st+=`💣 あと${t.cnt}ターンで爆発（${t.boom}ダメージ）<br>`;
      if(k==='abyss')st+=`🌀 波動まで あと${3-(t.ch||0)}ターン（${Math.round(t.atk*2.5)}ダメージ）<br>`;
      return tipHead(d.icon,(t.elite?'⭐強い':'')+d.name+(t.boss?'（ボス）':''))+
      `HP <b style="color:#ff6b6b">${t.hp}</b>/${t.maxHp}　攻撃 <b style="color:#ffd54a">${k==='bomb'?'-':atkNow(t)}</b>${k!=='bomb'&&atkNow(t)<t.atk?`<small style="color:#a99">（弱って ${t.atk}→${atkNow(t)}）</small>`:''}　装甲 <b style="color:#7fc4ff">${t.armor}</b><br>${d.desc}<br>${st}`+
      (t.elite?'⭐ 強化個体：HP・攻撃・装甲が高いが、経験値も多い<br>':'')+`倒すには合計<b>${t.hp+t.armor}</b>ダメージ${k==='ghost'?'（剣は半分しか効かない）':''}。経験値+${xpOf(t)}`;}
  }
  return '';
}

}
